<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#15803d">
<title>💰 Paie des employées</title>
<style>
  :root{--bg:#eef2f0;--card:#fff;--text:#111827;--muted:#6b7280;--red:#dc2626;--green:#16a34a;--green-bg:#dcfce7;--orange:#ea580c;--border:#e5e7eb;--violet:#7c3aed}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.3rem;margin:4px 0 2px;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:10px}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
  .k{background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .k .l{font-size:.78rem;color:var(--muted);font-weight:700}
  .k .v{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;border:2px solid var(--border);background:#fff;border-radius:12px;padding:10px 4px;font-weight:800;font-size:.92rem;color:var(--text)}
  .tabs button.on{border-color:var(--green);background:var(--green-bg);color:#166534}
  .bar{display:flex;gap:8px;margin-bottom:12px}
  .bar input{flex:1;font-size:1rem;padding:10px;border-radius:12px;border:2px solid var(--border)}
  .bar button{border:none;border-radius:12px;padding:0 14px;font-weight:800;background:var(--violet);color:#fff}
  .fiche{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:3px solid transparent}
  .fiche.paye{border-color:var(--green);background:#f0fdf4}
  .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .fh b{font-size:1.15rem}
  .st{font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .st.cours{background:#fef3c7;color:#92400e} .st.fini{background:#e0e7ff;color:#3730a3} .st.ok{background:var(--green);color:#fff}
  .meta{color:var(--muted);font-size:.8rem;margin:3px 0 8px;line-height:1.45}
  .lig{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--border);font-variant-numeric:tabular-nums}
  .lig.neg span:last-child{color:var(--red)}
  .lig.net{font-size:1.15rem;font-weight:900;border-top:2px solid var(--text);margin-top:2px;padding-top:7px}
  .pay{width:100%;border:none;border-radius:13px;padding:14px;font-size:1.08rem;font-weight:900;margin-top:10px;color:#fff;background:var(--orange)}
  .pay.ok{background:var(--green)}
  .annul{display:block;margin:6px auto 0;border:none;background:none;color:var(--muted);text-decoration:underline;font-size:.8rem}
  .noqr{font-size:.75rem;color:var(--red);font-weight:700;text-align:center;margin-top:6px}
  #maj{text-align:center;color:var(--muted);font-size:.8rem;margin-top:6px}
  a.back{display:block;text-align:center;margin-top:12px;color:var(--violet);font-weight:700;text-decoration:none}
  .air{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.75);display:flex;align-items:center;justify-content:center;padding:16px}
  .air[hidden]{display:none}
  .boite{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:18px;text-align:center;max-height:92vh;overflow:auto}
  .boite .nom{font-size:1.2rem;font-weight:900}
  .boite .mt{font-size:2.3rem;font-weight:900;color:var(--orange);margin:4px 0 8px;font-variant-numeric:tabular-nums}
  .boite img{width:100%;max-width:320px;border-radius:12px;border:1px solid var(--border)}
  .boite .b{width:100%;border:none;border-radius:13px;padding:14px;font-size:1.05rem;font-weight:900;margin-top:10px}
  .vide{background:#fff;border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
  @media print{ .tabs,.bar,.pay,.annul,a.back,#maj{display:none!important} body{background:#fff} .fiche{break-inside:avoid;box-shadow:none;border:1px solid #999} }
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 Paie des employées</h1>
  <div class="sub">Une fiche par employée · brut − pénalités − retenues = net à payer</div>
  <div class="kpis">
    <div class="k"><div class="l">⏳ Reste à payer</div><div class="v" id="kReste">–</div></div>
    <div class="k"><div class="l">✅ Déjà payé</div><div class="v" id="kPaye" style="color:var(--green)">–</div></div>
  </div>
  <div class="tabs">
    <button type="button" data-f="apayer" class="on">À payer</button>
    <button type="button" data-f="payees">Payées</button>
    <button type="button" data-f="toutes">Toutes</button>
  </div>
  <div class="bar"><input id="cherche" placeholder="🔎 Nom de l'employée"><button type="button" id="recalc">🔄</button><button type="button" onclick="window.print()" style="background:#475569">🖨️</button></div>
  <div id="liste"><div class="vide">Chargement…</div></div>
  <div id="maj"></div>
  <a class="back" href="patron.html">← Espace patron</a>
</div>

<div class="air" id="qrDlg" hidden>
  <div class="boite">
    <div class="nom" id="qNom"></div>
    <div style="color:var(--muted);font-size:.85rem" id="qInfo"></div>
    <div class="mt" id="qMt"></div>
    <div id="qImg">⏳ QR Code…</div>
    <button type="button" class="b" id="qOk" style="background:var(--green);color:#fff">✅ J'ai payé</button>
    <button type="button" class="b" id="qX" style="background:#e5e7eb;color:#111">Fermer</button>
  </div>
</div>

<script src="autorisation.js?v=8"></script>
<script>
// 💰 FICHE DE PAIE : une fiche par employée (onglet « 💰 Paie contrats ») · 💰 Payer → QR Code banque de la fille · ✅ payé → fiche verte
const API='https://script.google.com/macros/s/AKfycbxyz1ElnhUFdqn4NXSAny9tyhnTh7oeQ9hicxbsUzHLsuSPEVh82sWBBqFuWWJnB4Q5/exec';
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baht=n=>Math.round(n||0).toLocaleString('en-US')+' ฿';
const dm=iso=>iso?String(iso).split('-').reverse().slice(0,2).join('/'):'';
async function readTxt(r){ let t=(await r.text()).trim(); if(t[0]==='<'){ try{ t=new DOMParser().parseFromString(t,'text/html').body.innerText.trim(); }catch(e){} } return t; }
let L=[], filtre='apayer', courant=null;

function dessiner(){
  const q=($('cherche').value||'').trim().toLowerCase();
  let reste=0, paye=0; L.forEach(x=>{ if(x.paye) paye+=x.net; else if(x.net>0) reste+=x.net; });
  $('kReste').textContent=baht(reste); $('kPaye').textContent=baht(paye);
  const V=L.filter(x=>(filtre==='toutes' || (filtre==='payees'?x.paye:!x.paye)) && (!q || x.nom.toLowerCase().includes(q)))
           .sort((a,b)=>(a.paye-b.paye) || (a.payeLe<b.payeLe?-1:a.payeLe>b.payeLe?1:0) || a.nom.localeCompare(b.nom));
  if(!V.length){ $('liste').innerHTML='<div class="vide">'+(filtre==='payees'?'Aucune paie marquée payée.':filtre==='apayer'?'✅ Tout est payé.':'Aucune fiche.')+'</div>'; return; }
  $('liste').innerHTML=V.map(x=>{ const i=L.indexOf(x), cours=/en cours/i.test(x.statut);
    return '<div class="fiche'+(x.paye?' paye':'')+'">'
      +'<div class="fh"><b>'+esc(x.nom)+'</b><span class="st '+(x.paye?'ok':cours?'cours':'fini')+'">'+(x.paye?'✅ Payé':cours?'⏳ En cours':'🏁 Terminé')+'</span></div>'
      +'<div class="meta">'+esc(x.contrat)+' · '+dm(x.deb)+' → '+dm(x.fin)+' · à payer le <b>'+dm(x.payeLe)+'</b><br>'+esc(x.tours)+' tours · '+esc(x.niveau)+(x.tel?' · 📞 '+esc(x.tel):'')+'</div>'
      +'<div class="lig"><span>Montant brut</span><span>'+baht(x.brut)+'</span></div>'
      +'<div class="lig'+(x.pen?' neg':'')+'"><span>Pénalités</span><span>'+(x.pen?'− '+baht(x.pen):'0 ฿')+'</span></div>'
      +(x.ret?'<div class="lig neg"><span>Autres retenues</span><span>− '+baht(x.ret)+'</span></div>':'')
      +'<div class="lig net"><span>Net à payer</span><span>'+baht(x.net)+'</span></div>'
      +(x.paye?'<button type="button" class="pay ok" data-i="'+i+'" data-act="voir">✅ PAYÉ · '+baht(x.net)+'</button><button type="button" class="annul" data-i="'+i+'" data-act="annuler">annuler « payé »</button>'
              :'<button type="button" class="pay" data-i="'+i+'" data-act="payer"'+(x.net>0?'':' disabled style="opacity:.5"')+'>💰 PAYER · '+baht(x.net)+'</button>'+(x.qr?'':'<div class="noqr">⚠️ QR Code banque pas encore reçu : elle doit ouvrir son app une fois (ou l\'ajouter dans 👤 ข้อมูลของฉัน)</div>'))
      +'</div>'; }).join('');
}
async function charger(maj){
  $('maj').textContent=maj?'⏳ Recalcul de la paie… (jusqu\'à 1 minute)':'🔄 Mise à jour…';
  try{ const j=JSON.parse(await readTxt(await fetch(API+'?paieliste=1'+(maj?'&maj=1':'')+'&_='+Date.now())));
    if(j.err){ $('liste').innerHTML='<div class="vide">'+(j.err==='tok'?'🔐 Activez ce téléphone patron':'⚠️ '+esc(j.err))+'</div>'; $('maj').textContent=''; return; }
    L=j.liste||[]; dessiner(); $('maj').textContent='Mis à jour '+(j.maj||'')+' · 🔄 = recalculer avec les dernières journées';
  }catch(e){ $('maj').textContent='⚠️ Pas de connexion — réessayez'; }
}
async function marquer(x, paye){
  try{ const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'paiepaye',key:x.key,paye})})));
    if(!j.ok) throw 0; x.paye=paye; dessiner(); return true;
  }catch(e){ alert('❌ Pas enregistré — vérifiez internet et réessayez'); return false; }
}
async function ouvrirQr(x){
  courant=x; $('qNom').textContent=x.nom; $('qInfo').textContent=dm(x.deb)+' → '+dm(x.fin)+' · '+(x.tel||''); $('qMt').textContent=baht(x.net);
  $('qOk').style.display=x.paye?'none':'block'; $('qImg').innerHTML='⏳ QR Code…'; $('qrDlg').hidden=false;
  try{ const j=JSON.parse(await readTxt(await fetch(API+'?qrimg='+encodeURIComponent(x.cle)+'&_='+Date.now())));
    if(courant!==x) return;
    $('qImg').innerHTML=j.ok&&j.img?'<img src="'+j.img+'" alt="QR Code">':'<div class="noqr" style="font-size:.95rem">⚠️ Pas de QR Code banque pour '+esc(x.nom)+'.<br>Elle doit le choisir dans son app : 👤 ข้อมูลของฉัน → QR Code ธนาคาร</div>';
  }catch(e){ $('qImg').innerHTML='<div class="noqr">⚠️ QR Code non chargé — réessayez</div>'; }
}
$('liste').addEventListener('click',async e=>{ const b=e.target.closest('button[data-act]'); if(!b) return; const x=L[+b.dataset.i]; if(!x) return;
  if(b.dataset.act==='payer' || b.dataset.act==='voir') ouvrirQr(x);
  if(b.dataset.act==='annuler' && confirm('Remettre '+x.nom+' en « à payer » ?')) marquer(x,false); });
$('qOk').onclick=async()=>{ const x=courant; if(!x) return; $('qOk').disabled=true; $('qOk').textContent='⏳ …';
  const ok=await marquer(x,true); $('qOk').disabled=false; $('qOk').textContent='✅ J\'ai payé'; if(ok) $('qrDlg').hidden=true; };
$('qX').onclick=()=>{ $('qrDlg').hidden=true; courant=null; };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ filtre=b.dataset.f; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); dessiner(); });
$('cherche').oninput=dessiner; $('recalc').onclick=()=>charger(true);
charger(false);
</script>
</body>
</html>
