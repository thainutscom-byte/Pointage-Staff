<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dc2626">
<title>📝 Patron · Réservations / การจอง</title>
<style>
  :root{--bg:#e5e7eb;--card:#fff;--text:#111827;--muted:#6b7280;--red:#dc2626;--redbg:#fee2e2;--green:#16a34a;--border:#e5e7eb;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:460px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 30px;}
  h1{font-size:1.25rem;margin:4px 0 12px;text-align:center}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h2{font-size:1rem;margin:0 0 8px}
  .emp{display:block;width:100%;text-align:left;border:2px solid var(--border);background:#fff;border-radius:12px;padding:12px;margin:0 0 8px;font-size:1.05rem;color:var(--text)}
  .emp small{color:var(--muted);font-size:.8rem}
  .emp.svc{border-left:7px solid var(--green)}
  .emp.on{border-color:var(--red);background:var(--redbg)}
  .emp.blk{opacity:.5}
  .sep{font-size:.8rem;color:var(--muted);margin:8px 0 6px}
  .pen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pen button{border:2px solid var(--border);background:#fff;border-radius:12px;padding:12px 8px;font-size:.95rem;text-align:left;color:var(--text)}
  .pen button.on{border-color:var(--red);background:var(--redbg);font-weight:800}
  .big{width:100%;border:none;border-radius:14px;padding:16px;font-size:1.15rem;font-weight:800;color:#fff;background:var(--red)}
  .big:disabled{background:#9ca3af}
  .big.green{background:var(--green)}
  input{width:100%;font-size:1.6rem;text-align:center;letter-spacing:6px;padding:12px;border-radius:12px;border:2px solid var(--border)}
  #msg{margin-top:10px;font-weight:700;text-align:center;min-height:20px}
  a.sms{display:block;text-align:center;margin-top:10px;background:var(--green);color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:14px}
  .small{font-size:.8rem;color:var(--muted);text-align:center}
  .cor{width:100%;border-collapse:collapse;margin-top:8px}
  .cor th{background:#fef08a;font-size:.8rem;padding:6px 4px;border:1px solid #fde68a;text-align:center}
  .cor td{border:1px solid #fde68a;padding:6px 4px;text-align:center;font-weight:700;background:#fefce8}
  .cor td.nom{text-align:left;font-size:.9rem}
  .cor .st{display:flex;align-items:center;justify-content:center;gap:2px}
  .cor .st button{flex:0 0 30px;width:30px;height:34px;padding:0;border-radius:10px;border:none;background:#e5e7eb;font-size:1.2rem;font-weight:800;color:var(--text)}
  .cor input{width:40px;min-width:0;font-size:1.25rem;letter-spacing:0;padding:4px 0;border:2px solid #fde68a;border-radius:8px;background:#fff;font-weight:800;text-align:center}
  .cor tr.tot td{background:#fef08a;font-weight:800}
  .paie{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
  .paie th{background:#dcfce7;font-size:.78rem;padding:6px 4px;border:1px solid #bbf7d0;text-align:center}
  .paie td{border:1px solid #d1fae5;padding:6px 4px;text-align:center}
  .paie td.nom{text-align:left;font-weight:700}
  .paie tr.tot td{background:#fef3c7;font-weight:800}
  .refus{display:block;width:100%;margin-top:10px;border:2px solid var(--red);background:#fff;color:var(--red);border-radius:12px;padding:11px;font-size:.95rem;font-weight:800;text-align:center;text-decoration:none}
  .refus:disabled{opacity:.6}
  .retenu{display:block;width:100%;margin-top:10px;border:none;background:var(--green);color:#fff;border-radius:12px;padding:12px;font-size:.95rem;font-weight:800;text-align:center}
  .okrefus{margin-top:10px;font-weight:800;color:var(--green);text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 Réservations reçues<br><span style="font-size:1rem;font-weight:700">การจองที่ได้รับ</span></h1>
  <div id="main">
    <div class="card">
      <h2>📝 Réservations reçues / การจองที่ได้รับ</h2>
      <div id="resa" class="small">Chargement… / กำลังโหลด…</div>
    </div>
    <div id="err" class="small" style="color:var(--red);font-weight:700"></div>
    <div class="small" style="margin-top:14px"><a href="#" onclick="actualiser();return false">🔄 Actualiser / รีเฟรช</a></div>
  </div>
</div>
<script src="autorisation.js?v=8"></script>
<script>

// 👥 places par horaire : 4 (avril → octobre) · 5 (du 1er novembre au 30 mars)
// 👥 places par horaire : réglées par le patron (page « 🗓️ Places disponibles ») · avril→octobre = ete · 1er nov.→30 mars = hiver
let CAPS={ete:4,hiver:5}; try{ const c0=JSON.parse(localStorage.getItem('pointage_caps')||'null'); if(c0 && c0.ete) CAPS=c0; }catch(e){}
fetch('https://script.google.com/macros/s/AKfycbxyz1ElnhUFdqn4NXSAny9tyhnTh7oeQ9hicxbsUzHLsuSPEVh82sWBBqFuWWJnB4Q5/exec?caps=1&_='+Date.now()).then(r=>r.text()).then(t=>{ try{ const c=JSON.parse(t); if(c && c.ete){ CAPS={ete:+c.ete, hiver:+c.hiver, sh:c.sh||{}}; try{ localStorage.setItem('pointage_caps', JSON.stringify(CAPS)); }catch(e){} } }catch(e){} }).catch(()=>{});
function capJour(iso, sh){ const m=+String(iso).slice(5,7), d=+String(iso).slice(8,10), hiv=(m>=11 || m<=2 || (m===3 && d<=30)), p=(sh && CAPS.sh && CAPS.sh[sh]) || CAPS; return +(hiv ? p.hiver : p.ete) || (hiv ? 5 : 4); }   // sh = horaire (places réglées horaire par horaire)
function capPeriode(deb, n, sh){ let c=99; const s=new Date(deb+'T00:00:00'); for(let i=0;i<(+n||1);i++){ const x=new Date(s); x.setDate(s.getDate()+i); const iso=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); c=Math.min(c, capJour(iso, sh)); } return c; }
const API='https://script.google.com/macros/s/AKfycbxyz1ElnhUFdqn4NXSAny9tyhnTh7oeQ9hicxbsUzHLsuSPEVh82sWBBqFuWWJnB4Q5/exec';
const $=id=>document.getElementById(id);
function getPin(){ return 'x'; }   // plus de code patron
async function readTxt(r){ let t=(await r.text()).trim(); if(t[0]==='<'){ try{ t=new DOMParser().parseFromString(t,'text/html').body.innerText.trim(); }catch(e){} } return t; }
function isoJ(o){ const d=new Date(Date.now()-6*3600e3); d.setDate(d.getDate()+(o||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function chargerBoss(){ const r=await fetch(API+'?boss=1&pin='+encodeURIComponent(getPin())+'&d='+isoJ(0)+'&_='+Date.now()); return JSON.parse(await readTxt(r)); }
function fmtTel(t){ const d=String(t||'').replace(/\D/g,''); return d.length===10 ? d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6) : (t||''); }
function ligne(txt,css){ const c=document.createElement('div'); c.style.cssText='margin-top:4px;text-align:left;'+(css||''); c.textContent=txt; return c; }
// ❌ Profil non retenu : annule l'essai (la place du planning se libère) puis propose le SMS à envoyer (texte modifiable ici)
const MSG_REFUS='ขอบคุณที่สนใจสมัครทดลองงานกับเรา ขออภัยด้วย ทางเราพิจารณาโปรไฟล์ของคุณแล้วพบว่ายังไม่ตรงกับที่เรากำลังมองหา จึงขอยกเลิกคำขอทดลองงานของคุณ ขอบคุณมาก';
function smsRefus(num){ return 'sms:'+num+(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(MSG_REFUS); }
// ✅ Profil retenu : copie le message d'invitation (modifiable ici) + ouvre LINE pour ajouter son ID + SMS en secours
function msgRetenu(x){ return 'สวัสดี ขอบคุณที่สนใจสมัครทดลองงานกับเรา โปรไฟล์ของคุณผ่านการพิจารณาแล้ว ขอเชิญมาทดลองงานวันที่ '+x.deb+' เวลา '+(x.sh||'12:00-20:00')+' น. กรุณายืนยันการมา ขอบคุณ'; }
function smsMsg(num,msg){ return 'sms:'+num+(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(msg); }
async function copier(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ try{ const a=document.createElement('textarea'); a.value=t; a.style.cssText='position:fixed;opacity:0'; document.body.appendChild(a); a.select(); const ok=document.execCommand('copy'); a.remove(); return ok; }catch(z){ return false; } } }
function boutonRetenu(x,num){
  const zone=document.createElement('div'); zone.className='zr';
  const cle='retenu|'+num+'|'+x.recu, actions=document.createElement('div');
  const fait=()=>{ try{ return !!localStorage.getItem(cle); }catch(e){ return false; } };
  const b=document.createElement('button'); b.className='retenu';
  const maj=()=>{ b.textContent=fait()?'✅ Retenue · rouvrir les actions / ผ่านแล้ว · เปิดเมนูอีกครั้ง':'✅ Profil retenu · inviter sur LINE / โปรไฟล์ผ่าน · เชิญทาง LINE'; };
  b.onclick=async()=>{
    const msg=msgRetenu(x), ok=await copier(msg);
    try{ localStorage.setItem(cle,'1'); }catch(e){}
    maj(); actions.innerHTML='';
    actions.appendChild(ligne(ok?'📋 Message copié : ajoutez-la sur LINE, puis collez-le dans la conversation. / คัดลอกข้อความแล้ว เพิ่มเพื่อนใน LINE แล้ววางข้อความในแชท':'⚠️ Copie impossible : utilisez le SMS ci-dessous. / คัดลอกไม่ได้ ใช้ SMS ด้านล่างแทน','font-weight:800;color:'+(ok?'var(--green)':'#ea580c')));
    if(x.line){ const a=document.createElement('a'); a.className='sms'; a.target='_blank'; a.rel='noopener'; a.href='https://line.me/R/ti/p/~'+encodeURIComponent(x.line); a.textContent='➕ Ajouter '+x.line+' sur mon LINE / เพิ่มเป็นเพื่อนใน LINE'; actions.appendChild(a); }
    else actions.appendChild(ligne('ℹ️ Pas d\'ID LINE pour cette candidate. / ผู้สมัครไม่มี LINE ID','color:var(--muted)'));
    if(num){ const s=document.createElement('a'); s.className='sms'; s.style.background='#2563eb'; s.href=smsMsg(num,msg); s.textContent='📱 Ou envoyer le message par SMS / หรือส่งข้อความทาง SMS'; actions.appendChild(s); }
  };
  maj(); zone.appendChild(b); zone.appendChild(actions); return zone;
}
function boutonRefus(x,num,d){
  const zone=document.createElement('div'); const b=document.createElement('button'); b.className='refus'; b.textContent='❌ Profil non retenu · annuler l\'essai / โปรไฟล์ไม่ผ่าน · ยกเลิกการทดลองงาน'; zone.appendChild(b);
  b.onclick=async()=>{
    if(!confirm('Annuler l\'essai de '+x.nom+' ('+x.deb+') et libérer la place ?\nยกเลิกการทดลองงานของ '+x.nom+' ('+x.deb+') และคืนที่ว่าง?')) return;
    b.disabled=true; b.textContent='⏳ …';
    try{
      const j=JSON.parse(await readTxt(await fetch(API+'?boss=1&pin='+encodeURIComponent(getPin())+'&annuleessai=1&cle='+encodeURIComponent(x.cle||'')+'&deb='+encodeURIComponent(x.deb)+'&_='+Date.now())));
      if(j.err==='inconnue'){ zone.innerHTML=''; zone.appendChild(ligne('ℹ️ Déjà annulée ou introuvable — touchez « Actualiser ». / ยกเลิกไปแล้วหรือไม่พบ กด «รีเฟรช»','color:var(--muted);font-weight:700')); return; }
      if(j.err==='pas_essai'){ zone.innerHTML=''; zone.appendChild(ligne('⛔ Ce n\'est pas un jour d\'essai : rien annulé. / ไม่ใช่วันทดลองงาน ไม่มีการยกเลิก','color:var(--red);font-weight:700')); return; }
      if(!j.ok) throw 0;
      zone.innerHTML=''; d.style.opacity='.75'; const zr=d.querySelector('.zr'); if(zr) zr.remove();
      const m=ligne('✅ Essai annulé · la place est libérée dans le planning / ยกเลิกแล้ว คืนที่ว่างในตารางแล้ว','font-weight:800;color:var(--green)'); zone.appendChild(m);
      if(num){ const a=document.createElement('a'); a.className='sms'; a.href=smsRefus(num); a.textContent='📱 Envoyer le SMS de refus à / ส่ง SMS ปฏิเสธถึง '+x.nom.split(' ')[0]; zone.appendChild(a); }
    }catch(e){ b.disabled=false; b.textContent='❌ Profil non retenu · annuler l\'essai / โปรไฟล์ไม่ผ่าน · ยกเลิกการทดลองงาน'; zone.appendChild(ligne('❌ Pas envoyé — réessayez (script Google à jour ?) / ส่งไม่สำเร็จ ลองใหม่ (อัปเดตสคริปต์ Google แล้วหรือยัง?)','color:var(--red);font-weight:700')); }
  };
  return zone;
}
async function charger(){
  const R=$('resa');
  try{
    const j=await chargerBoss(); $('err').textContent=''; R.innerHTML='';
    const L=j.resa||[];
    if(!L.length){ R.textContent='Aucune réservation pour le moment. / ยังไม่มีการจอง'; return; }
    R.style.color='var(--text)'; R.style.fontSize='.95rem'; R.style.textAlign='left';
    L.forEach(x=>{
      const d=document.createElement('div'); d.style.cssText='border-top:1px solid var(--border);padding:12px 0;color:var(--text);font-size:.95rem';
      const t=document.createElement('div'); t.innerHTML='<b style="font-size:1.05rem"></b> <span class="small"></span>';
      t.querySelector('b').textContent='🆕 '+x.nom; t.querySelector('.small').textContent='· reçu / รับเมื่อ '+x.recu; d.appendChild(t);
      // 📞 numéro de téléphone bien visible + appeler / SMS
      const num=String(x.tel||'').replace(/\D/g,'');
      const p=document.createElement('div'); p.style.cssText='display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap';
      const n=document.createElement('span'); n.style.cssText='font-size:1.2rem;font-weight:800;letter-spacing:.5px'; n.textContent='📞 '+fmtTel(x.tel); p.appendChild(n);
      if(num){ [['tel:','Appeler / โทร','#16a34a'],['sms:','SMS','#2563eb']].forEach(([s,l,c])=>{ const a=document.createElement('a'); a.href=s+num; a.textContent=l; a.style.cssText='background:'+c+';color:#fff;text-decoration:none;font-weight:800;padding:6px 12px;border-radius:10px;font-size:.9rem'; p.appendChild(a); }); }
      d.appendChild(p);
      if(x.age||x.line) d.appendChild(ligne((x.age?'🎂 '+x.age+' ans / ปี':'')+(x.age&&x.line?' · ':'')+(x.line?'💬 LINE : '+x.line:'')));
      d.appendChild(ligne('🕐 '+x.sh+' · 🗓️ '+x.deb+' → '+x.fin+' · '+x.contrat+(/^🧪/.test(x.contrat||'')?' / ทดลองงาน 1 วัน':'')));
      if(x.suite) d.appendChild(ligne('🧪 '+x.suite,'font-weight:800;color:'+(/📄/.test(x.suite)?'var(--green)':'var(--muted)')));
      if(x.th) d.appendChild(ligne('🇹🇭 '+x.th,'font-weight:700;color:'+(/⚠️/.test(x.th)?'var(--red)':'var(--green)')));
      if(/^🧪/.test(x.contrat||'')){ d.appendChild(boutonRetenu(x,num)); d.appendChild(boutonRefus(x,num,d)); }
      R.appendChild(d); });
  }catch(e){ R.textContent='⚠️ Pas de connexion — réessayez / ไม่มีการเชื่อมต่อ ลองใหม่อีกครั้ง'; }
}
function actualiser(){ charger(); }
actualiser();
</script>
</body>
</html>
