<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>ส่ง SMS</title>
<style>
  :root{--bg:#e5e7eb;--card:#fff;--text:#111827;--muted:#6b7280;--green:#16a34a;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:420px;margin:0 auto;padding:24px 16px;}
  .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.08);}
  h1{font-size:1.2rem;margin:0 0 10px;text-align:center;}
  .to{font-weight:800;font-size:1.05rem;word-break:break-all;margin-bottom:10px;text-align:center;}
  .msg{background:#f3f4f6;border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;margin-bottom:16px;min-height:20px;}
  a.btn{display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;font-weight:800;font-size:1.2rem;padding:16px;border-radius:14px;}
  .small{color:var(--muted);font-size:.85rem;text-align:center;margin-top:12px;}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>📱 ส่ง SMS / Envoyer SMS</h1>
  <div class="to" id="to"></div>
  <div class="msg" id="msg"></div>
  <a class="btn" id="go" href="#">📱 เปิดข้อความ / Ouvrir Messages</a>
  <div class="small">Messages s'ouvre avec le numéro et le texte → appuyez sur <b>Envoyer ➤</b></div>
</div></div>
<script>
  const q = new URLSearchParams(location.search);
  const to = (q.get('to') || '').split(',').map(s => s.trim()).filter(Boolean);
  const body = q.get('b') || '';
  document.getElementById('to').textContent = to.join(', ') || '—';
  document.getElementById('msg').textContent = body;
  // Android : sms:+66..?body=…   iPhone : sms:+66..&body=…
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const nums = to.join(ios ? ',' : ',');
  const href = 'sms:' + nums + (body ? (ios ? '&' : '?') + 'body=' + encodeURIComponent(body) : '');
  const a = document.getElementById('go'); a.href = href;
  // ouverture automatique (si le téléphone l'autorise), sinon le gros bouton vert
  if (to.length) setTimeout(() => { try { location.href = href; } catch (e) {} }, 300);
</script>
</body>
</html>
