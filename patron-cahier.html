<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c3aed">
<title>📸 Contrôle du cahier</title>
<style>
  :root{--bg:#e5e7eb;--card:#fff;--text:#111827;--muted:#6b7280;--red:#dc2626;--green:#16a34a;--orange:#ea580c;--violet:#7c3aed;--border:#e5e7eb;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px));}
  h1{font-size:1.25rem;margin:4px 0 2px;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .k{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .k .v{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
  .k .l{font-size:.8rem;color:var(--muted);font-weight:700}
  .card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .card h2{font-size:1rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  .card h2 small{font-weight:600;color:var(--muted);font-size:.8rem}
  .row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:.95rem}
  .row:first-of-type{border-top:none}
  .st{font-weight:800;font-size:.85rem;white-space:nowrap}
  .ok{color:var(--green)} .ret{color:var(--red)} .att{color:var(--orange)} .fin{color:var(--muted)}
  .m{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
  a.back{display:block;text-align:center;margin-top:10px;color:var(--violet);font-weight:700;text-decoration:none}
  #maj{text-align:center;color:var(--muted);font-size:.8rem}
  .ctc{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
  .ctc a,.ctc button{flex:1 1 30%;text-align:center;text-decoration:none;border:none;border-radius:9px;padding:8px 4px;font-weight:800;font-size:.85rem}
  .fj{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
  .fj th{background:#ede9fe;font-size:.72rem;padding:6px 3px;text-align:center;border:1px solid #ddd6fe}
  .fj td{border:1px solid #ede9fe;padding:6px 3px;text-align:center}
  .fj td.n{text-align:left;font-weight:700}
  .fj tr.tot td{background:#fef3c7;font-weight:800}
  .fj .ko{color:var(--red);font-size:.75rem;font-weight:700}
  .fjtop{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .chbtn{display:block;text-align:center;border-radius:12px;padding:13px;font-weight:800;background:var(--violet);color:#fff;cursor:pointer;margin-bottom:6px}
  .ch{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
  .ch th{background:#ede9fe;font-size:.7rem;padding:5px 2px;border:1px solid #ddd6fe}
  .ch td{border:1px solid #ede9fe;padding:4px 2px;text-align:center;vertical-align:middle}
  .ch td.n{text-align:left;font-weight:700;font-size:.82rem}
  .ch input{width:100%;max-width:58px;font-size:1rem;padding:6px 2px;text-align:center;border:2px solid var(--border);border-radius:8px}
  .ch input.diff{border-color:var(--red);background:#fee2e2;color:var(--red);font-weight:800}
  .ch .app{display:block;font-size:.68rem;color:var(--red);font-weight:700}
  .ch button{border:none;border-radius:8px;padding:7px 6px;font-weight:800;background:var(--green);color:#fff;font-size:.78rem}
  .ch tr.ok td{background:#dcfce7}
  .fjtop input{flex:1;font-size:1rem;padding:8px;border-radius:10px;border:2px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 Contrôle avec le cahier</h1>
  <div class="card" id="cahier">
        <div class="sub" style="text-align:left;margin:0 0 8px">1. Photo de la feuille papier · 2. Tapez les chiffres du cahier · 3. Les erreurs des filles sont en <b style="color:var(--red)">rouge</b> → ✔ Corriger</div>
    <div class="fjtop"><input type="date" id="chDate" onchange="chCharger()"><button onclick="chCharger()" style="border:none;border-radius:10px;padding:9px 12px;font-weight:800;background:var(--violet);color:#fff">🔄</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label class="chbtn">📸 Prendre une photo<input type="file" accept="image/*" capture="environment" id="chFile" onchange="chPhoto(this)" style="display:none"></label>
      <label class="chbtn" style="background:#fff;color:var(--violet);border:2px solid var(--violet)">🖼️ Choisir une photo<input type="file" accept="image/*" id="chFile2" onchange="chPhoto(this)" style="display:none"></label>
    </div>
    <div id="chPhotoMsg" class="sub" style="text-align:left;margin:4px 0"></div>
    <div id="chPhotoBox" style="display:none;position:sticky;top:0;z-index:5;background:var(--card);padding:4px 0 8px">
      <img id="chImg" alt="cahier" onclick="chZoom()" style="width:100%;max-height:38vh;object-fit:contain;border-radius:10px;border:2px solid var(--border);background:#000">
      <div class="sub" style="margin:2px 0 0">👆 toucher la photo pour l'agrandir</div>
    </div>
    <div id="chCorps">Chargement…</div>
  </div>
  <div id="chZoom" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;z-index:100001;background:#000;overflow:auto"><img id="chZoomImg" alt="" style="width:200%;max-width:none"><div style="position:fixed;top:10px;right:10px;background:#fff;border-radius:999px;padding:8px 14px;font-weight:800">✕</div></div>
  <div id="maj"></div>
  <a class="back" href="patron.html">← Espace patron</a>
</div>
<script src="autorisation.js?v=8"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbxyz1ElnhUFdqn4NXSAny9tyhnTh7oeQ9hicxbsUzHLsuSPEVh82sWBBqFuWWJnB4Q5/exec';
const $=id=>document.getElementById(id);
const isoJ=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function readTxt(r){ let t=(await r.text()).trim(); if(t[0]==='<'){ try{ t=new DOMParser().parseFromString(t,'text/html').body.innerText.trim(); }catch(e){} } return t; }
function debutMin(sh){ const m=String(sh||'').match(/^(\d{1,2})[h:](\d{2})?/); return m ? (+m[1])*60+(+(m[2]||0)) : null; }
function finMin(sh){ const m=String(sh||'').match(/-(\d{1,2})[h:]?(\d{2})?/); if(!m) return null; let f=(+m[1])*60+(+(m[2]||0)); const d=debutMin(sh); if(d!==null && f<=d) f+=1440; return f; }
const cle=(nom,tel)=>String(nom||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(tel||'').replace(/\D/g,'');
const fmt=n=>Math.round(n).toLocaleString('en-US');
async function charger(){
  const now=new Date(), base=new Date(now.getTime()-6*3600e3), jour=isoJ(base); base.setHours(0,0,0,0);
  const min=(now-base)/60000;
  $('date').textContent=base.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  try{
    const [B,M,D]=await Promise.all([
      fetch(API+'?boss=1&pin=x&d='+jour+'&_='+Date.now()).then(readTxt).then(JSON.parse),
      fetch(API+'?boss=1&pin=x&mjour='+jour+'&_='+Date.now()).then(readTxt).then(JSON.parse).catch(()=>({})),
      fetch(API+'?jourdetail='+jour+'&_='+Date.now()).then(readTxt).then(JSON.parse).catch(()=>({}))]);
    if(B.err){ $('liste').innerHTML='<div class="card">🔐 Activez ce téléphone patron pour voir le tableau.</div>'; return; }
    if(window.autLineIds) await window.autLineIds();
    // journée envoyée par le téléphone (onglet Massages) = elle a travaillé, même si le ▶️ du jour n'est pas arrivé dans Google
    const k9=(n,t)=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(t||'').replace(/\D/g,'').slice(-9);
    const J={}, ARRV={};
    Object.keys(M.jour||{}).forEach(k=>{ const q=k.split('|'); J[k9(q[0],q[1])]=M.jour[k]; });
    (D.lignes||[]).forEach(x=>{ const k=k9(x.nom,x.tel); ARRV[k]=String(x.arr||'').replace(/[^\d:]/g,'').slice(0,5)||'✓'; if(!J[k]) J[k]={l1:x.l1,l2:x.l2,hh:x.hh}; });
    const groupes={}; let pres=0, abs=0, mas=0, ca=0;
    const emps=(B.emps||[]).filter(e=>!e.bloque);
    emps.forEach(e=>{
      const h=(B.hor||{})[e.label], sh=h && h.deb<=jour && h.fin>=jour ? h.sh : '';
      const kk=k9(e.nom,e.tel), envoyee=!!J[kk] || !!ARRV[kk], m=J[kk]||{}, n=(+m.l1||0)+(+m.l2||0)+(+m.hh||0), c=(+m.l1||0)*600+(+m.l2||0)*800+(+m.hh||0)*600;
      if(!sh && !e.service && !n) return;                         // pas de contrat aujourd'hui
      const d=debutMin(sh), f=finMin(sh);
      let st, cls;
      if(e.service){ st='● arrivée '+(e.depuis||''); cls='ok'; pres++; }
      else if(envoyee){ st='✅ journée envoyée'+(ARRV[kk] && ARRV[kk]!=='✓'?' · arrivée '+ARRV[kk]:''); cls='ok'; pres++; }
      else if(d!==null && min>=d+15 && (f===null || min<=f)){ st='⏰ pas de ▶️ reçu ('+Math.round(min-d)+' min)'; cls='ret'; abs++; }
      else if(d!==null && f!==null && min>f){ st='❓ aucun pointage reçu'; cls='ret'; abs++; }
      else { st='⏳ à '+String(Math.floor((d||0)/60)).padStart(2,'0')+':'+String((d||0)%60).padStart(2,'0'); cls='att'; }
      mas+=n; ca+=c;
      (groupes[sh||'(sans horaire)']=groupes[sh||'(sans horaire)']||[]).push({nom:e.nom, tel:e.tel, st, cls, n});
    });
    $('kPres').textContent=pres; $('kAbs').textContent=abs; $('kAbs').style.color=abs?'var(--red)':'';
    $('kMas').textContent=mas.toLocaleString('en-US'); $('kCA').textContent=fmt(ca)+' ฿';
    const L=$('liste'); L.innerHTML='';
    Object.keys(groupes).sort((a,b)=>(debutMin(a)??999)-(debutMin(b)??999)).forEach(sh=>{
      const c=document.createElement('div'); c.className='card';
      const g=groupes[sh]; c.innerHTML='<h2><span></span><small></small></h2>';
      c.querySelector('span').textContent='🕐 '+sh; c.querySelector('small').textContent=g.filter(x=>x.cls==='ok').length+'/'+g.length+' présentes';
      g.forEach(x=>{ const r=document.createElement('div'); r.className='row';
        r.innerHTML='<div><b></b></div><div class="st"></div><div class="m"></div>';
        r.querySelector('b').textContent=x.nom; const s=r.querySelector('.st'); s.textContent=x.st; s.classList.add(x.cls);
        r.querySelector('.m').textContent=x.n?x.n+' 💆':'–';
        if(x.cls==='ret' && window.autContact){ const z=document.createElement('div'); z.className='ctc'; window.autContact(z, {nom:x.nom, tel:x.tel, sh}); r.appendChild(z); }
        c.appendChild(r); });
      L.appendChild(c); });
    if(!L.children.length) L.innerHTML='<div class="card">Aucune employée prévue aujourd\'hui.</div>';
    $('maj').textContent='Mis à jour à '+now.toTimeString().slice(0,5)+' · actualisation toutes les minutes';
  }catch(e){ $('maj').textContent='⚠️ Pas de connexion — nouvel essai dans 1 minute'; }
}
// 📋 FEUILLE DU JOUR : journées validées par les filles (onglet Massages), détail par fille
async function feuille(){
  const C=$('fjCorps'), d=$('fjDate').value; if(!d) return; C.textContent='Chargement…';
  try{
    const j=JSON.parse(await readTxt(await fetch(API+'?jourdetail='+d+'&_='+Date.now())));
    if(j.err){ C.textContent = j.err==='tok' ? '🔐 Activez ce téléphone patron' : '⚠️ Erreur'; return; }
    const L=(j.lignes||[]).filter(x=>!/^boss$/i.test(x.nom.trim()) || x.ca);
    if(!L.length){ C.innerHTML='<div class="sub">Aucune journée validée pour cette date.</div>'; return; }
    const n2=v=>Math.round(v*2*100)/100;
    let h='<table class="fj"><tr><th>Nom</th><th>1 lady</th><th>2 lady</th><th>Happy Hour</th></tr>', T={l1:0,l2:0,hh:0,ca:0};
    L.forEach(x=>{ T.l1+=x.l1; T.l2+=x.l2; T.hh+=x.hh; T.ca+=x.ca;
      h+='<tr><td class="n">'+x.nom.replace(/[<>&]/g,'')+'</td><td>'+(x.l1||'–')+'</td><td>'+(n2(x.l2)||'–')+'</td><td>'+(n2(x.hh)||'–')+'</td></tr>'; });
    h+='<tr class="tot"><td class="n">TOTAL</td><td>'+T.l1+'</td><td>'+n2(T.l2)+'</td><td>'+n2(T.hh)+'</td></tr></table>';
    h+='<div class="kpis" style="margin:10px 0 0"><div class="k"><div class="l">💆 Total massages</div><div style="font-size:.7rem;color:var(--muted)">2 lady / Happy Hour = ½</div><div class="v">'+(Math.round((T.l1+T.l2+T.hh)*10)/10).toLocaleString('en-US')+'</div></div>'
      +'<div class="k"><div class="l">💰 Total</div><div class="v">'+fmt(T.ca)+' ฿</div></div></div>';
    C.innerHTML=h;
  }catch(e){ C.textContent='⚠️ Pas de connexion — réessayez'; }
}

// ===== 📸 CONTRÔLE AVEC LE CAHIER : photo de la feuille papier + chiffres du cahier → les différences sont corrigées =====
let CH={jour:'', lignes:[], sans:[]};
const PRX={l1:600,l2:800,hh:600};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chZoom(){ $('chZoomImg').src=$('chImg').src; $('chZoom').style.display='block'; }
async function chPhoto(inp){
  const f=inp.files&&inp.files[0]; if(!f) return; const jour=$('chDate').value; const M=$('chPhotoMsg');
  M.textContent='⏳ Préparation de la photo…';
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(f); });
    const k=Math.min(1,1800/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); const data=c.toDataURL('image/jpeg',0.75);
    $('chImg').src=data; $('chPhotoBox').style.display='block';
    M.textContent='⏳ Envoi de la photo dans Google Drive…';
    const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'cahierphoto',jour,img:data})})));
    if(!j.ok) throw j.err||'x';
    M.innerHTML='✅ Photo rangée dans Drive → dossier « Cahier Pointage » · <a href="'+esc(j.url)+'" target="_blank">ouvrir</a>';
  }catch(e){ M.textContent = e==='tok' ? '🔐 Activez ce téléphone patron' : '⚠️ Photo non envoyée dans Drive (elle reste affichée ici) — réessayez'; }
  inp.value='';
}
async function chPhotosDrive(jour){
  try{ const j=JSON.parse(await readTxt(await fetch(API+'?cahier='+jour+'&_='+Date.now())));
    if(j.ok && j.photos && j.photos.length && $('chDate').value===jour && !$('chPhotoBox').style.display.includes('block'))
      $('chPhotoMsg').innerHTML='🗂️ Déjà dans Drive pour ce jour : '+j.photos.map((p,i)=>'<a href="'+esc(p.url)+'" target="_blank">photo '+(j.photos.length-i)+'</a>').join(' · ');
  }catch(e){}
}
async function chCharger(){
  const jour=$('chDate').value, C=$('chCorps'); if(!jour) return; C.textContent='Chargement…';
  $('chPhotoBox').style.display='none'; $('chPhotoMsg').textContent=''; chPhotosDrive(jour);
  try{
    const [B,M]=await Promise.all([
      fetch(API+'?boss=1&pin=x&d='+jour+'&_='+Date.now()).then(readTxt).then(JSON.parse),
      fetch(API+'?boss=1&pin=x&mjour='+jour+'&_='+Date.now()).then(readTxt).then(JSON.parse)]);
    if(B.err||M.err){ C.textContent='🔐 Activez ce téléphone patron'; return; }
    const J=M.jour||{}, emps=(B.emps||[]).filter(e=>!/^boss$/i.test(String(e.nom).trim()));
    CH={jour, lignes:[], sans:[]};
    emps.forEach(e=>{ const m=J[cle(e.nom,e.tel)], h=(B.hor||{})[e.label], prevue=h && h.deb<=jour && h.fin>=jour;
      if(m) CH.lignes.push({label:e.label, nom:e.nom, app:{l1:+m.l1||0,l2:+m.l2||0,hh:+m.hh||0}});
      else if(prevue && !e.bloque) CH.sans.push(e.nom); });
    CH.lignes.sort((a,b)=>a.nom.localeCompare(b.nom));
    chDessiner();
  }catch(e){ C.textContent='⚠️ Pas de connexion — réessayez'; }
}
function chDessiner(){
  const C=$('chCorps');
  if(!CH.lignes.length){ C.innerHTML='<div class="sub">Aucune journée envoyée par les filles pour cette date.</div>'+(CH.sans.length?'<div class="sub" style="color:var(--red)">⚠️ Prévues mais sans journée : '+esc(CH.sans.join(', '))+'</div>':''); return; }
  let h='<table class="ch"><tr><th>Nom</th><th>1 lady</th><th>2 lady</th><th>Happy H.</th><th></th></tr>';
  CH.lignes.forEach((x,i)=>{ h+='<tr id="chR'+i+'"><td class="n">'+esc(x.nom)+'</td>';
    ['l1','l2','hh'].forEach(k=>{ h+='<td><input type="number" min="0" step="'+(k==='l1'?1:1)+'" inputmode="numeric" id="ch_'+i+'_'+k+'" value="'+x.app[k]+'" oninput="chMaj()"><span class="app" id="cha_'+i+'_'+k+'"></span></td>'; });
    h+='<td><button id="chB'+i+'" style="display:none" onclick="chCorriger('+i+')">✔ Corriger</button></td></tr>'; });
  h+='</table>';
  h+='<div class="kpis" style="margin:10px 0 0"><div class="k"><div class="l">📱 Selon les filles</div><div class="v" id="chTApp">–</div></div><div class="k"><div class="l">📖 Selon le cahier</div><div class="v" id="chTCah">–</div></div></div>';
  h+='<div id="chEcart" style="text-align:center;font-weight:800;margin:8px 0"></div>';
  h+='<button class="chbtn" id="chTout" style="display:none;width:100%;border:none;background:var(--green)" onclick="chToutCorriger()"></button>';
  if(CH.sans.length) h+='<div class="sub" style="color:var(--red);text-align:left">⚠️ Prévues mais sans journée envoyée : <b>'+esc(CH.sans.join(', '))+'</b> — si elles ont travaillé, la fille doit valider sa journée dans l\'app (ensuite vous pourrez corriger ici).</div>';
  h+='<div class="sub" style="text-align:left">2 lady et Happy Hour = nombre de passages (comme sur l\'app des filles). La correction met à jour Google et le téléphone de la fille.</div>';
  C.innerHTML=h; chMaj();
}
function chVal(i,k){ return Math.max(0,+($('ch_'+i+'_'+k).value)||0); }
function chMaj(){
  let tA=0,tC=0,mA=0,mC=0,n=0;
  CH.lignes.forEach((x,i)=>{ let diff=false;
    ['l1','l2','hh'].forEach(k=>{ const v=chVal(i,k), a=x.app[k], el=$('ch_'+i+'_'+k), d=v!==a; el.classList.toggle('diff',d); $('cha_'+i+'_'+k).textContent=d?'app '+a:''; if(d) diff=true;
      tA+=a*PRX[k]; tC+=v*PRX[k]; mA+=k==='l1'?a:a/2; mC+=k==='l1'?v:v/2; });
    $('chB'+i).style.display=diff?'':'none'; if(diff) n++; });
  const f=(m,t)=>(Math.round(m*10)/10).toLocaleString('en-US')+' 💆<br><span style="font-size:1rem">'+fmt(t)+' ฿</span>';
  $('chTApp').innerHTML=f(mA,tA); $('chTCah').innerHTML=f(mC,tC);
  const e=tC-tA; $('chEcart').innerHTML = n ? '<span style="color:var(--red)">❌ '+n+' fille'+(n>1?'s':'')+' avec erreur · écart '+(e>0?'+':'')+fmt(e)+' ฿</span>' : '<span style="color:var(--green)">✅ Le cahier et l\'app sont identiques</span>';
  const b=$('chTout'); b.style.display=n>1?'block':'none'; b.textContent='✔ Corriger les '+n+' filles';
}
async function chCorriger(i, silencieux){
  const x=CH.lignes[i], b=$('chB'+i), v={l1:chVal(i,'l1'),l2:chVal(i,'l2'),hh:chVal(i,'hh')};
  if(!silencieux && !confirm('Corriger '+x.nom+' le '+CH.jour.split('-').reverse().join('/')+' ?\n\n1 lady '+x.app.l1+' → '+v.l1+'\n2 lady '+x.app.l2+' → '+v.l2+'\nHappy Hour '+x.app.hh+' → '+v.hh)) return false;
  b.disabled=true; b.textContent='⏳';
  try{
    const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'bosscorrige',label:x.label,date:CH.jour,l1:v.l1,l2:v.l2,hh:v.hh})})));
    if(!j.ok) throw j.err||'x';
    x.app={l1:+j.l1||0,l2:+j.l2||0,hh:+j.hh||0}; ['l1','l2','hh'].forEach(k=>$('ch_'+i+'_'+k).value=x.app[k]);
    $('chR'+i).classList.add('ok'); b.disabled=false; b.textContent='✔ Corriger'; chMaj(); if($('fjCorps')) feuille(); return true;
  }catch(e){ b.disabled=false; b.textContent='✔ Corriger';
    if(!silencieux) alert(e==='tok'?'🔐 Activez ce téléphone patron':e==='ligne'?'❌ Aucune journée envoyée à cette date':e==='date'?'❌ Date non permise (60 jours max)':'❌ Pas envoyé — réessayez'); return false; }
}
async function chToutCorriger(){
  const L=CH.lignes.map((x,i)=>i).filter(i=>$('chB'+i).style.display!=='none'); if(!L.length) return;
  if(!confirm('Corriger '+L.length+' filles avec les chiffres du cahier ?')) return;
  const b=$('chTout'); b.disabled=true; let ko=0;
  for(const i of L){ b.textContent='⏳ '+CH.lignes[i].nom+'…'; if(!(await chCorriger(i,true))) ko++; }
  b.disabled=false; chMaj(); if(ko) alert('⚠️ '+ko+' correction(s) non envoyée(s) — réessayez');
}
(()=>{ const b=new Date(Date.now()-6*3600e3); $('chDate').value=isoJ(b); $('chDate').max=isoJ(new Date()); chCharger(); })();
</script>
