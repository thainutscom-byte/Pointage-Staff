<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>📒 Cahier papier</title>
<style>
  :root{--bg:#e5e7eb;--card:#fff;--text:#111827;--muted:#6b7280;--red:#dc2626;--green:#16a34a;--border:#e5e7eb}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 30px}
  h1{font-size:1.2rem;text-align:center;margin:4px 0 6px}
  .sous{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:12px;line-height:1.4}
  .card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .jh{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th{color:var(--muted);font-size:.72rem;text-align:center;padding:4px 2px;border-bottom:2px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  td{padding:5px 2px;border-bottom:1px solid var(--border);text-align:center;font-variant-numeric:tabular-nums}
  tr.d td{background:#fef2f2} tr.d td.c{color:var(--red);font-weight:800}
  tr.f td{background:#f0fdf4}
  .btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:1.05rem;font-weight:800;color:#fff;cursor:pointer;margin-top:8px}
  .btn:disabled{opacity:.5}
  .ok{color:var(--green)} .ko{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📒 Remettre les chiffres du cahier papier</h1>
  <div class="sous">27/09 → 03/10 · lu sur vos photos du cahier<br>1 lady · 2 lady · Happy Hour par fille (massage à 2 = 0,5 chacune)</div>
  <div id="res"><div class="card" style="text-align:center">⏳ Comparaison avec Google…</div></div>
  <button class="btn" id="go" style="background:var(--green)" disabled>✅ Remettre les chiffres du cahier dans Google</button>
  <div id="msg" style="text-align:center;font-weight:700;margin-top:10px"></div>
  <a href="patron.html" style="display:block;text-align:center;margin-top:14px;color:var(--red);font-weight:700;text-decoration:none">← Espace patron</a>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxyz1ElnhUFdqn4NXSAny9tyhnTh7oeQ9hicxbsUzHLsuSPEVh82sWBBqFuWWJnB4Q5/exec';
const $=id=>document.getElementById(id), esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fr=n=>String(Math.round(n*10)/10).replace('.',','), baht=n=>Math.round(n).toLocaleString('fr-FR')+' ฿';
async function post(op){ let t=(await (await fetch(API,{method:'POST',body:JSON.stringify({type:'papier',op})})).text()).trim(); if(t[0]==='<'){ try{ t=new DOMParser().parseFromString(t,'text/html').body.innerText.trim(); }catch(e){} } const j=JSON.parse(t); if(!j.ok) throw j.err||'x'; return j; }
function dessiner(j){
  let nd=0;
  $('res').innerHTML=j.jours.map(J=>{ const p=J.jour.split('-'), d=J.filles.filter(f=>f.diff).length; nd+=d;
    return '<div class="card"><div class="jh"><span>'+p[2]+'/'+p[1]+'</span><span class="'+(J.caGoogle===J.caCahier?'ok':'ko')+'">Google '+baht(J.caGoogle)+' · cahier '+baht(J.caCahier)+'</span></div>'
      +'<table><tr><th>Employée</th><th>Google<br>1L · 2L · HH</th><th>Cahier<br>1L · 2L · HH</th></tr>'
      +J.filles.map(f=>'<tr class="'+(f.fait?'f':f.diff?'d':'')+'"><td><b>'+esc(f.nom)+'</b>'+(f.fait?' ✅':f.ko?' ⚠️':'')+'</td><td>'+(f.google?f.google.map(fr).join(' · '):'—')+'</td><td class="c">'+f.cahier.map(fr).join(' · ')+'</td></tr>').join('')
      +'</table></div>'; }).join('');
  return nd;
}
async function verifier(){
  try{ const j=await post('verif'), nd=dessiner(j);
    $('go').disabled=!nd; $('go').textContent=nd?'✅ Remettre les chiffres du cahier ('+nd+' ligne'+(nd>1?'s':'')+' en rouge)':'✅ Tout correspond au cahier';
  }catch(e){ $('res').innerHTML='<div class="card ko" style="text-align:center">❌ Pas de réponse de Google — installez le dernier script Autorisation (+ Nouvelle version).</div>'; }
}
$('go').onclick=async()=>{
  if(!confirm('Remplacer les chiffres en rouge par ceux du cahier papier ?\nLes téléphones recevront les bons chiffres à leur prochaine ouverture.')) return;
  $('go').disabled=true; $('go').textContent='⏳ Correction en cours… (jusqu\'à 1 minute)';
  try{ const j=await post('appliquer'); dessiner(j);
    $('msg').innerHTML='<span class="ok">✅ '+j.corrigees+' journée(s) corrigée(s) · « CA par jour » recalculé</span>'+(j.introuvables.length?'<br><span class="ko">⚠️ Pas trouvée dans « Employés » : '+esc(j.introuvables.join(', '))+' — à corriger à la main</span>':'');
    $('go').textContent='✅ Fait'; setTimeout(verifier,1500);
  }catch(e){ $('go').disabled=false; $('go').textContent='✅ Remettre les chiffres du cahier dans Google'; $('msg').innerHTML='<span class="ko">❌ Pas fait — réessayez</span>'; }
};
verifier();
</script>
</body>
</html>
