<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c3aed">
<title>📊 Aujourd'hui</title>
<style>
  :root{--bg:#e5e7eb;--card:#fff;--text:#111827;--muted:#6b7280;--red:#dc2626;--green:#16a34a;--orange:#ea580c;--violet:#7c3aed;--border:#e5e7eb;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px));}
  h1{font-size:1.25rem;margin:4px 0 2px;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .k{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .k .v{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
  .k .l{font-size:.8rem;color:var(--muted);font-weight:700}
  .card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .card h2{font-size:1rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  .card h2 small{font-weight:600;color:var(--muted);font-size:.8rem}
  .row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:.95rem}
  .row:first-of-type{border-top:none}
  .st{font-weight:800;font-size:.85rem;white-space:nowrap}
  .ok{color:var(--green)} .ret{color:var(--red)} .att{color:var(--orange)} .fin{color:var(--muted)}
  .m{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
  a.back{display:block;text-align:center;margin-top:10px;color:var(--violet);font-weight:700;text-decoration:none}
  #maj{text-align:center;color:var(--muted);font-size:.8rem}
  .ctc{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
  .ctc a,.ctc button{flex:1 1 30%;text-align:center;text-decoration:none;border:none;border-radius:9px;padding:8px 4px;font-weight:800;font-size:.85rem}
  .fj{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
  .fj th{background:#ede9fe;font-size:.72rem;padding:6px 3px;text-align:center;border:1px solid #ddd6fe}
  .fj td{border:1px solid #ede9fe;padding:6px 3px;text-align:center}
  .fj td.n{text-align:left;font-weight:700}
  .fj tr.tot td{background:#fef3c7;font-weight:800}
  .fj .ko{color:var(--red);font-size:.75rem;font-weight:700}
  .fjtop{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .fjtop input{flex:1;font-size:1rem;padding:8px;border-radius:10px;border:2px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Aujourd'hui en direct</h1>
  <div class="sub" id="date"></div>
  <div class="kpis">
    <div class="k"><div class="l">👩 Présentes</div><div class="v" id="kPres">–</div></div>
    <div class="k"><div class="l">⏰ Pas encore arrivées</div><div class="v" id="kAbs">–</div></div>
    <div class="k"><div class="l">💆 Massages du jour</div><div class="v" id="kMas">–</div></div>
    <div class="k"><div class="l">💰 Chiffre du jour</div><div class="v" id="kCA">–</div></div>
  </div>
  <div id="liste"><div class="card">Chargement…</div></div>
  <div class="card" id="feuille">
    <h2><span>📋 Feuille du jour — massages validés</span></h2>
    <div class="fjtop"><input type="date" id="fjDate" onchange="feuille()"><button onclick="feuille()" style="border:none;border-radius:10px;padding:9px 12px;font-weight:800;background:var(--violet);color:#fff">🔄</button></div>
    <div id="fjCorps" class="sub">Chargement…</div>
  </div>
  <div id="maj"></div>
  <a class="back" href="patron.html">← Espace patron</a>
</div>
<script src="autorisation.js?v=5"></script>
<script>
const API='https://script.google.com/macros/s/AKfycbxyz1ElnhUFdqn4NXSAny9tyhnTh7oeQ9hicxbsUzHLsuSPEVh82sWBBqFuWWJnB4Q5/exec';
const $=id=>document.getElementById(id);
const isoJ=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function readTxt(r){ let t=(await r.text()).trim(); if(t[0]==='<'){ try{ t=new DOMParser().parseFromString(t,'text/html').body.innerText.trim(); }catch(e){} } return t; }
function debutMin(sh){ const m=String(sh||'').match(/^(\d{1,2})[h:](\d{2})?/); return m ? (+m[1])*60+(+(m[2]||0)) : null; }
function finMin(sh){ const m=String(sh||'').match(/-(\d{1,2})[h:]?(\d{2})?/); if(!m) return null; let f=(+m[1])*60+(+(m[2]||0)); const d=debutMin(sh); if(d!==null && f<=d) f+=1440; return f; }
const cle=(nom,tel)=>String(nom||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(tel||'').replace(/\D/g,'');
const fmt=n=>Math.round(n).toLocaleString('en-US');
async function charger(){
  const now=new Date(), base=new Date(now.getTime()-6*3600e3), jour=isoJ(base); base.setHours(0,0,0,0);
  const min=(now-base)/60000;
  $('date').textContent=base.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  try{
    const [B,M]=await Promise.all([
      fetch(API+'?boss=1&pin=x&d='+jour+'&_='+Date.now()).then(readTxt).then(JSON.parse),
      fetch(API+'?boss=1&pin=x&mjour='+jour+'&_='+Date.now()).then(readTxt).then(JSON.parse).catch(()=>({}))]);
    if(B.err){ $('liste').innerHTML='<div class="card">🔐 Activez ce téléphone patron pour voir le tableau.</div>'; return; }
    if(window.autLineIds) await window.autLineIds();
    const J=M.jour||{}, groupes={}; let pres=0, abs=0, mas=0, ca=0;
    const emps=(B.emps||[]).filter(e=>!e.bloque);
    emps.forEach(e=>{
      const h=(B.hor||{})[e.label], sh=h && h.deb<=jour && h.fin>=jour ? h.sh : '';
      const m=J[cle(e.nom,e.tel)]||{}, n=(+m.l1||0)+(+m.l2||0)+(+m.hh||0), c=(+m.l1||0)*600+(+m.l2||0)*800+(+m.hh||0)*600;
      if(!sh && !e.service && !n) return;                         // pas de contrat aujourd'hui
      const d=debutMin(sh), f=finMin(sh);
      let st, cls;
      if(e.service){ st='● arrivée '+(e.depuis||''); cls='ok'; pres++; }
      else if(d!==null && min>=d+15 && (f===null || min<=f)){ st='⏰ retard '+Math.round(min-d)+' min'; cls='ret'; abs++; }
      else if(d!==null && f!==null && min>f){ st='— absente'; cls='ret'; abs++; }
      else { st='⏳ à '+String(Math.floor((d||0)/60)).padStart(2,'0')+':'+String((d||0)%60).padStart(2,'0'); cls='att'; }
      mas+=n; ca+=c;
      (groupes[sh||'(sans horaire)']=groupes[sh||'(sans horaire)']||[]).push({nom:e.nom, tel:e.tel, st, cls, n});
    });
    $('kPres').textContent=pres; $('kAbs').textContent=abs; $('kAbs').style.color=abs?'var(--red)':'';
    $('kMas').textContent=mas.toLocaleString('en-US'); $('kCA').textContent=fmt(ca)+' ฿';
    const L=$('liste'); L.innerHTML='';
    Object.keys(groupes).sort((a,b)=>(debutMin(a)??999)-(debutMin(b)??999)).forEach(sh=>{
      const c=document.createElement('div'); c.className='card';
      const g=groupes[sh]; c.innerHTML='<h2><span></span><small></small></h2>';
      c.querySelector('span').textContent='🕐 '+sh; c.querySelector('small').textContent=g.filter(x=>x.cls==='ok').length+'/'+g.length+' présentes';
      g.forEach(x=>{ const r=document.createElement('div'); r.className='row';
        r.innerHTML='<div><b></b></div><div class="st"></div><div class="m"></div>';
        r.querySelector('b').textContent=x.nom; const s=r.querySelector('.st'); s.textContent=x.st; s.classList.add(x.cls);
        r.querySelector('.m').textContent=x.n?x.n+' 💆':'–';
        if(x.cls==='ret' && window.autContact){ const z=document.createElement('div'); z.className='ctc'; window.autContact(z, {nom:x.nom, tel:x.tel, sh}); r.appendChild(z); }
        c.appendChild(r); });
      L.appendChild(c); });
    if(!L.children.length) L.innerHTML='<div class="card">Aucune employée prévue aujourd\'hui.</div>';
    $('maj').textContent='Mis à jour à '+now.toTimeString().slice(0,5)+' · actualisation toutes les minutes';
  }catch(e){ $('maj').textContent='⚠️ Pas de connexion — nouvel essai dans 1 minute'; }
}
// 📋 FEUILLE DU JOUR : journées validées par les filles (onglet Massages), détail par fille
async function feuille(){
  const C=$('fjCorps'), d=$('fjDate').value; if(!d) return; C.textContent='Chargement…';
  try{
    const j=JSON.parse(await readTxt(await fetch(API+'?jourdetail='+d+'&_='+Date.now())));
    if(j.err){ C.textContent = j.err==='tok' ? '🔐 Activez ce téléphone patron' : '⚠️ Erreur'; return; }
    const L=(j.lignes||[]).filter(x=>!/^boss$/i.test(x.nom.trim()) || x.ca);
    if(!L.length){ C.textContent='Aucune journée validée pour cette date.'; return; }
    const n2=v=>Math.round(v*2*100)/100, eq=x=>x.l1+x.l2+x.hh;
    let h='<table class="fj"><tr><th>Fille</th><th>1 lady<br>600</th><th>2 lady<br>800</th><th>Happy<br>Hour</th><th>Total<br>💆</th><th>CA ฿</th><th>Heures</th></tr>', T={l1:0,l2:0,hh:0,ca:0};
    L.forEach(x=>{ T.l1+=x.l1; T.l2+=x.l2; T.hh+=x.hh; T.ca+=x.ca;
      const pb=[]; if(/Retard|Absent/i.test(x.sit)) pb.push(x.sit.replace(/,?\s*OK/,'')); if(x.pen) pb.push('-'+fmt(x.pen)+' ฿');
      h+='<tr><td class="n">'+x.nom.replace(/[<>&]/g,'')+(pb.length?'<div class="ko">'+pb.join(' · ').replace(/[<>&]/g,'')+'</div>':'')+'</td><td>'+(x.l1||'–')+'</td><td>'+(n2(x.l2)||'–')+'</td><td>'+(n2(x.hh)||'–')+'</td><td><b>'+eq(x)+'</b></td><td>'+fmt(x.ca)+'</td><td style="font-size:.75rem">'+(x.arr||'?')+'<br>'+(x.dep||'?')+'</td></tr>'; });
    h+='<tr class="tot"><td class="n">TOTAL ('+L.length+')</td><td>'+T.l1+'</td><td>'+n2(T.l2)+'</td><td>'+n2(T.hh)+'</td><td>'+(T.l1+T.l2+T.hh)+'</td><td>'+fmt(T.ca)+'</td><td></td></tr></table>';
    h+='<div class="sub" style="margin-top:6px;text-align:left">2 lady et Happy Hour = nombre de massages · « Total 💆 » compte 2 lady et Happy Hour pour ½ · seules les journées validées apparaissent</div>';
    C.innerHTML=h;
  }catch(e){ C.textContent='⚠️ Pas de connexion — réessayez'; }
}
(()=>{ const b=new Date(Date.now()-6*3600e3); $('fjDate').value=isoJ(b); feuille(); })();
setInterval(()=>{ if(!document.hidden) feuille(); }, 5*60000);
charger(); setInterval(charger, 60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) charger(); });
</script>
</body>
</html>
