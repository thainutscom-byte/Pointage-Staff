<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16a34a">
<title>🗓️ Places disponibles</title>
<style>
  :root{--bg:#e5e7eb;--card:#fff;--text:#111827;--muted:#6b7280;--red:#dc2626;--redbg:#fee2e2;--green:#16a34a;--border:#e5e7eb;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:460px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 30px;}
  h1{font-size:1.25rem;margin:4px 0 12px;text-align:center}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h2{font-size:1rem;margin:0 0 8px}
  .emp{display:block;width:100%;text-align:left;border:2px solid var(--border);background:#fff;border-radius:12px;padding:12px;margin:0 0 8px;font-size:1.05rem;color:var(--text)}
  .emp small{color:var(--muted);font-size:.8rem}
  .emp.svc{border-left:7px solid var(--green)}
  .emp.on{border-color:var(--red);background:var(--redbg)}
  .emp.blk{opacity:.5}
  .sep{font-size:.8rem;color:var(--muted);margin:8px 0 6px}
  .pen{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pen button{border:2px solid var(--border);background:#fff;border-radius:12px;padding:12px 8px;font-size:.95rem;text-align:left;color:var(--text)}
  .pen button.on{border-color:var(--red);background:var(--redbg);font-weight:800}
  .big{width:100%;border:none;border-radius:14px;padding:16px;font-size:1.15rem;font-weight:800;color:#fff;background:var(--red)}
  .big:disabled{background:#9ca3af}
  .big.green{background:var(--green)}
  input{width:100%;font-size:1.6rem;text-align:center;letter-spacing:6px;padding:12px;border-radius:12px;border:2px solid var(--border)}
  #msg{margin-top:10px;font-weight:700;text-align:center;min-height:20px}
  a.sms{display:block;text-align:center;margin-top:10px;background:var(--green);color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:14px}
  .small{font-size:.8rem;color:var(--muted);text-align:center}
  .cor{width:100%;border-collapse:collapse;margin-top:8px}
  .cor th{background:#fef08a;font-size:.8rem;padding:6px 4px;border:1px solid #fde68a;text-align:center}
  .cor td{border:1px solid #fde68a;padding:6px 4px;text-align:center;font-weight:700;background:#fefce8}
  .cor td.nom{text-align:left;font-size:.9rem}
  .cor .st{display:flex;align-items:center;justify-content:center;gap:2px}
  .cor .st button{flex:0 0 30px;width:30px;height:34px;padding:0;border-radius:10px;border:none;background:#e5e7eb;font-size:1.2rem;font-weight:800;color:var(--text)}
  .cor input{width:40px;min-width:0;font-size:1.25rem;letter-spacing:0;padding:4px 0;border:2px solid #fde68a;border-radius:8px;background:#fff;font-weight:800;text-align:center}
  .cor tr.tot td{background:#fef08a;font-weight:800}
  .paie{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
  .paie th{background:#dcfce7;font-size:.78rem;padding:6px 4px;border:1px solid #bbf7d0;text-align:center}
  .paie td{border:1px solid #d1fae5;padding:6px 4px;text-align:center}
  .paie td.nom{text-align:left;font-weight:700}
  .paie tr.tot td{background:#fef3c7;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗓️ Places disponibles</h1>
  <div id="main">
    <div class="card">
      <h2>🗓️ Places disponibles <span style="font-weight:normal;color:var(--muted);font-size:.8rem">(4 max par horaire · 5 du 01/11 au 30/03)</span></h2>
      <div id="places">Chargement…</div>
    </div>
    <div id="err" class="small" style="color:var(--red);font-weight:700"></div>
    <div class="small" style="margin-top:14px"><a href="#" onclick="actualiser();return false">🔄 Actualiser</a></div>
  </div>
  <a href="patron.html" style="display:block;text-align:center;margin-top:12px;color:var(--red);font-weight:700;text-decoration:none">← Espace patron</a>
</div>
<script src="autorisation.js?v=8"></script>
<script>

// 👥 places par horaire : 4 (avril → octobre) · 5 (du 1er novembre au 30 mars)
function capJour(iso){ const m=+String(iso).slice(5,7), d=+String(iso).slice(8,10); return (m>=11 || m<=2 || (m===3 && d<=30)) ? 5 : 4; }
function capPeriode(deb, n){ let c=5; const s=new Date(deb+'T00:00:00'); for(let i=0;i<(+n||1);i++){ const x=new Date(s); x.setDate(s.getDate()+i); const iso=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); c=Math.min(c, capJour(iso)); } return c; }
const API='https://script.google.com/macros/s/AKfycbxyz1ElnhUFdqn4NXSAny9tyhnTh7oeQ9hicxbsUzHLsuSPEVh82sWBBqFuWWJnB4Q5/exec';
const $=id=>document.getElementById(id);
function getPin(){ return 'x'; }   // plus de code patron
async function readTxt(r){ let t=(await r.text()).trim(); if(t[0]==='<'){ try{ t=new DOMParser().parseFromString(t,'text/html').body.innerText.trim(); }catch(e){} } return t; }
function isoJ(o){ const d=new Date(Date.now()-6*3600e3); d.setDate(d.getDate()+(o||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function chargerBoss(){ const r=await fetch(API+'?boss=1&pin='+encodeURIComponent(getPin())+'&d='+isoJ(0)+'&_='+Date.now()); return JSON.parse(await readTxt(r)); }
let emps=[];
// 🗓️ places libres par horaire : aujourd'hui et sur les 10 prochains jours (jour le plus chargé)
const SH=[['10h-16h','10:00-16:00 น.'],['13h-19h','13:00-19:00 น.'],['16h-22h','16:00-22:00 น.'],['19h-01h','19:00-01:00 น.'],['21h-03h','21:00-03:00 น.'],['09:00-17:00','09:00-17:00 น. (mensuel)'],['17:00-01:00','17:00-01:00 น. (mensuel)']];
async function places(){
  const P=$('places'); P.textContent='Chargement…';
  try{
    const q=n=>fetch(API+'?plan=1&emp=__patron__&tel=0&s='+isoJ(0)+'&n='+n+'&sh='+encodeURIComponent(SH.map(x=>x[0]).join(','))+'&_='+Date.now()).then(readTxt).then(JSON.parse);
    const [a,b]=await Promise.all([q(1),q(10)]);
        let h='<table style="width:100%;border-collapse:collapse;font-size:.95rem"><tr style="color:var(--muted);font-size:.8rem"><td>Horaire</td><td style="text-align:center">Libres aujourd\'hui</td><td style="text-align:center">10 jours</td></tr>';
    const ca=capJour(isoJ(0)), cb=capPeriode(isoJ(0),10);
    // PLACES LIBRES (le jour le plus chargé) : 3 filles sur 4 places → 1/4 · 🟢 il reste de la place · 🔴 0/4 complet
    const cell=(n,cap)=>{ const l=cap-n; return '<td style="text-align:center;font-weight:800;color:'+(l<=0?'var(--red)':'var(--green)')+'">'+Math.max(0,l)+'/'+cap+(l<0?'<div style="font-size:.7rem">⚠️ '+(-l)+' de trop</div>':l===0?'<div style="font-size:.7rem">complet</div>':'')+'</td>'; };
    PLN={};
    SH.forEach(([k,l])=>{ const na=(a[k]||{}).max||0, nb=(b[k]||{}).max||0; PLN[k]=na;
      h+='<tr class="plR" data-sh="'+k+'" style="border-top:1px solid var(--border);cursor:pointer" onclick="plDetail(this)"><td style="padding:8px 0">'+l+' <span style="color:var(--muted);font-size:.8rem">▸ qui ?</span></td>'+cell(na,ca)+cell(nb,cb)+'</tr>'; });
    P.innerHTML='<div id="plAlerte"></div>'+h+'</table><div class="small" style="margin-top:6px">1/4 = 1 place libre sur 4 · 🟢 il reste de la place · 🔴 0/4 complet · « 10 jours » = le jour le plus chargé · 👆 touchez un horaire pour voir qui occupe les places</div>';
    plCharger();
  }catch(e){ P.textContent='⚠️ Pas de connexion — réessayez'; }
}
// ===== 🗓️ QUI OCCUPE LES PLACES (contrats comptés dans le planning) =====
let PLD=null, PLDerr='', PLN={};
const dm=s=>String(s||'').split('-').reverse().slice(0,2).join('/');
const escH=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function plCharger(){
  PLDerr='';
  let j=null;
  let t=null; try{ t=await readTxt(await fetch(API+'?placesdetail='+isoJ(0)+'&n=10&_='+Date.now())); }catch(e){ PLDerr='reseau'; }
  if(t!==null){ try{ j=JSON.parse(t); }catch(e){ j=null; } }
  if(!PLDerr && (!j || !j.ok)) PLDerr = j && j.err==='tok' ? 'tok' : j && j.err ? 'serveur:'+j.err : 'version';
  if(PLDerr){ document.querySelectorAll('.plR').forEach(r=>{ if(r.nextElementSibling && r.nextElementSibling.classList.contains('plD')) plDetail(r, true); }); return; }
  try{ PLD=j.places||{};
    const fant=[]; Object.keys(PLD).forEach(sh=>PLD[sh].forEach(c=>{ if(c.compte && !c.dansEmp) fant.push(c.nom+' '+(c.tel||'')+' ('+sh+(c.auj?', aujourd\'hui':', du '+dm(c.deb))+')'+(c.memeTel?' = même numéro que '+c.memeTel+' → doublon':'')); }));
    $('plAlerte').innerHTML = fant.length ? '<div style="background:#fef2f2;border:2px solid var(--red);border-radius:10px;padding:8px;margin-bottom:8px;font-size:.88rem;color:var(--red);font-weight:700">⚠️ '+fant.length+' contrat'+(fant.length>1?'s':'')+' compté'+(fant.length>1?'s':'')+' sans fiche dans « Employés » : '+escH(fant.join(' · '))+'<br><span style="font-weight:600">→ touchez l\'horaire : 🗑️ Retirer si c\'est un doublon / une personne qui ne vient pas · ➕ Recréer sa fiche si c\'est une vraie employée</span></div>' : '';
    document.querySelectorAll('.plR').forEach(r=>{ if(r.nextElementSibling && r.nextElementSibling.classList.contains('plD')) plDetail(r, true); });
  }catch(e){}
}
const plListe=sh=>((PLD||{})[sh]||[]).filter(c=>c.compte);   // les bloquées et les comptes test ne s'affichent pas
function plDetail(tr, refaire){
  const nx=tr.nextElementSibling; if(nx && nx.classList.contains('plD')){ nx.remove(); if(!refaire) return; }
  const L=plListe(tr.dataset.sh), d=document.createElement('tr'); d.className='plD';
  let h='<td colspan="3" style="padding:4px 0 10px;font-size:.85rem">';
  if(!PLD && PLDerr){
    h+='<div style="background:#fef2f2;border:1px solid var(--red);border-radius:8px;padding:8px;color:var(--red);font-weight:700">'
      +(PLDerr==='version' ? '⚠️ Le script Google n\'a pas encore la liste des noms.<br><span style="font-weight:600">→ Apps Script : collez le dernier <b>Autorisation.txt</b> puis <b>Déployer → Gérer les déploiements → ✏️ → Nouvelle version</b>.</span>'
        : PLDerr==='tok' ? '🔐 Ce téléphone patron n\'est pas activé (code de la case B1).'
        : PLDerr==='reseau' ? '⚠️ Google n\'a pas répondu.' : '⚠️ Erreur du script : '+escH(PLDerr.slice(8)))
      +'<br><a href="#" onclick="plCharger();return false">🔄 Réessayer</a></div>';
  }
  else if(!PLD) h+='Chargement… (réessayez dans un instant)';
  else if(!L.length) h+='<span style="color:var(--muted)">Personne sur cet horaire.</span>';
  if(PLD){ const nAuj=L.filter(c=>c.auj).length, nT=PLN[tr.dataset.sh];
    h+='<div style="font-size:.85rem;font-weight:700;margin:2px 0 4px;color:'+(nT!==undefined && nT!==nAuj?'var(--red)':'#166534')+'">'+(nT!==undefined && nT!==nAuj ? '⚠️ Le tableau dit '+nT+' et la liste montre '+nAuj+' fille(s) aujourd\'hui — touchez 🔄 Actualiser' : '✔ '+nAuj+' fille'+(nAuj>1?'s':'')+' aujourd\'hui sur cet horaire · '+Math.max(0,capJour(isoJ(0))-nAuj)+' place(s) libre(s)')+'</div>'; }
  L.forEach(c=>{ const ko=c.compte && !c.dansEmp;
    h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;margin-top:3px;background:'+(ko?'#fee2e2':c.compte?'#f3f4f6':'#fafafa')+';'+(c.compte?'':'color:#6b7280')+'">'
      +'<span><b>'+escH(c.nom)+'</b> <span style="color:var(--muted)">'+escH(c.tel)+'</span><br>'+dm(c.deb)+' → '+dm(c.fin)+(c.auj?' · <b>aujourd\'hui</b>':'')+(c.impose?' · 👑':'')
      +(ko?' · <b style="color:var(--red)">⚠️ pas dans Employés</b>'+(c.memeTel?'<br><b style="color:#9a3412">📞 même numéro que la fiche « '+escH(c.memeTel)+' » → doublon (nom écrit autrement)</b>':''):'')+(c.bloque?' · 🚫 bloquée (pas comptée)':'')+(c.test?' · 🧪 test (pas comptée)':'')+'</span>'
      +'<span style="display:flex;flex-direction:column;gap:4px">'+(c.bloque?'<button data-sh="'+tr.dataset.sh+'" data-i="'+L.indexOf(c)+'" onclick="plDebloquer(this)" style="border:none;border-radius:8px;padding:6px 8px;background:#2563eb;color:#fff;font-weight:800;font-size:.75rem;white-space:nowrap;opacity:1">🔓 Débloquer</button>':'')+(ko && !c.memeTel?'<button data-sh="'+tr.dataset.sh+'" data-i="'+L.indexOf(c)+'" onclick="plRecreer(this)" style="border:none;border-radius:8px;padding:6px 8px;background:#16a34a;color:#fff;font-weight:800;font-size:.75rem;white-space:nowrap">➕ Recréer sa fiche</button>':'')
      +'<button data-sh="'+tr.dataset.sh+'" data-i="'+L.indexOf(c)+'" onclick="plRetirer(this)" style="border:none;border-radius:8px;padding:6px 8px;background:#fff;border:1px solid var(--red);color:var(--red);font-weight:800;font-size:.75rem;white-space:nowrap">🗑️ Retirer</button></span></div>'; });
  const mens=/mensuel/.test((SH.find(x=>x[0]===tr.dataset.sh)||['',''])[1]);
  h+='<div style="margin-top:8px;padding:8px;border:2px dashed #16a34a;border-radius:10px;background:#f0fdf4">'
    +'<div style="font-weight:800;color:#166534;margin-bottom:6px">➕ Ajouter une employée sur cet horaire</div>'
    +'<select class="plEmp" onchange="this.parentElement.querySelector(\'.plAutre\').style.display=this.value===\'autre\'?\'flex\':\'none\'" style="width:100%;font-size:1rem;padding:9px;border-radius:10px;border:2px solid var(--border);background:#fff;margin-bottom:6px"><option value="">⏳ chargement des employées…</option></select>'
    +'<div class="plAutre" style="display:none;gap:6px;margin-bottom:6px"><input class="plNom" placeholder="Surnom (ex. Namsom)" style="flex:1;min-width:0;font-size:1rem;letter-spacing:0;text-align:left;padding:8px;border-radius:10px;border:2px solid var(--border)"><input class="plTel" type="tel" inputmode="numeric" placeholder="06…" maxlength="10" style="flex:1;min-width:0;font-size:1rem;letter-spacing:0;text-align:left;padding:8px;border-radius:10px;border:2px solid var(--border)"></div>'
    +'<div style="display:flex;gap:6px;align-items:center"><span style="font-size:.85rem;white-space:nowrap">Début :</span><input type="date" class="plDeb" value="'+isoJ(0)+'" style="flex:1;font-size:1rem;letter-spacing:0;padding:8px;border-radius:10px;border:2px solid var(--border)"></div>'
    +'<div class="small" style="text-align:left;margin:4px 0 6px">Contrat '+(mens?'mensuel (30 jours)':'freelance (10 jours)')+'</div>'
    +'<button data-sh="'+tr.dataset.sh+'" onclick="plAjout(this)" style="width:100%;border:none;border-radius:10px;padding:12px;font-weight:800;font-size:1rem;background:#16a34a;color:#fff">✔ Valider</button></div>';
  d.innerHTML=h+'</td>'; tr.after(d);
  plEmpsRemplir(d.querySelector('.plEmp'));
}
let PLE=null;
async function plEmpsRemplir(S){
  try{ if(!PLE){ const j=JSON.parse(await readTxt(await fetch(API+'?boss=1&pin=x&d='+isoJ(0)+'&_='+Date.now()))); PLE=(j.emps||[]).filter(e=>!e.bloque && !/^boss$/i.test(String(e.nom).trim())).sort((a,b)=>String(a.nom).localeCompare(String(b.nom))); }
    const occ={}; Object.keys(PLD||{}).forEach(sh=>(PLD[sh]||[]).forEach(c=>{ if(c.fin>=isoJ(0)) occ[String(c.tel).replace(/\D/g,'').slice(-9)]=(SH.find(x=>x[0]===sh)||['',sh])[1].replace(' น.','').replace(' (mensuel)','')+' jusqu\'au '+dm(c.fin); }));
    S.innerHTML='<option value="">— choisir l\'employée —</option>'+PLE.map((e,i)=>{ const o=occ[String(e.tel).replace(/\D/g,'').slice(-9)]; return '<option value="'+i+'"'+(o?' disabled':'')+'>'+escH(e.nom)+' · '+escH(e.tel)+(o?' — déjà '+escH(o):'')+'</option>'; }).join('')+'<option value="autre">✍️ Autre : taper le nom et le numéro</option>';
  }catch(e){ S.innerHTML='<option value="">⚠️ liste non chargée — touchez à nouveau l\'horaire</option>'; }
}
async function plAjout(btn, forcer){
  const box=btn.parentElement, i=box.querySelector('.plEmp').value, deb=box.querySelector('.plDeb').value, sh=btn.dataset.sh, lab=(SH.find(x=>x[0]===sh)||['',sh])[1];
  let e=null;
  if(i==='autre'){ const n=(box.querySelector('.plNom').value||'').trim(), t=(box.querySelector('.plTel').value||'').replace(/\D/g,'');
    if(!/^[A-Za-z][A-Za-z .-]{0,20}$/.test(n)){ alert('Surnom en lettres anglaises (ex. Namsom)'); return; }
    if(!/^0[689]\d{8}$/.test(t)){ alert('Numéro thaï à 10 chiffres (06 / 08 / 09…)'); return; }
    e={nom:n, tel:t}; }
  else { if(i===''||!PLE||!PLE[+i]){ alert('Choisissez l\'employée'); return; } e=PLE[+i]; }
  if(!deb){ alert('Choisissez la date de début'); return; }
  if(!forcer && !confirm('Mettre '+e.nom+' sur '+lab+' à partir du '+dm(deb)+' ?')) return;
  const t0=btn.textContent; btn.disabled=true; btn.textContent='⏳ …';
  try{ const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'cycleajout',nom:e.nom,tel:e.tel,sh,deb,forcer:!!forcer})})));
    if(j.err==='plein'){ btn.disabled=false; btn.textContent=t0; if(confirm('🔴 Cet horaire est complet le '+dm(j.jour)+'.\nL\'ajouter quand même ?')) return plAjout(btn,true); return; }
    if(j.err==='chevauche'){ alert('⛔ '+e.nom+' a déjà un contrat : '+j.info.replace(/(\d{4})-(\d{2})-(\d{2})/g,'$3/$2')+'.\nPour la changer d\'horaire, utilisez la page 🕐 Changer l\'horaire.'); btn.disabled=false; btn.textContent=t0; return; }
    if(!j.ok) throw j.err||'x';
    alert('✅ '+j.nom+' est sur '+lab+' du '+dm(j.deb)+' au '+dm(j.fin)); places();
  }catch(x){ alert(x==='tok'?'🔐 Activez ce téléphone patron':'❌ Pas fait — réessayez'); btn.disabled=false; btn.textContent=t0; }
}
async function plDebloquer(btn){
  const sh=btn.dataset.sh, c=plListe(sh)[+btn.dataset.i]; if(!c) return;
  if(!confirm('Débloquer '+c.nom+' ?\nSon statut passe de « Bloqué » à « Actif » et elle compte de nouveau dans les places.')) return;
  btn.disabled=true; btn.textContent='⏳';
  try{ const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'debloquerfiche',cle:c.cle})})));
    if(j.err==='pas_bloquee'){ alert('ℹ️ '+c.nom+' n\'est plus bloquée — rechargez la page'); places(); return; }
    if(!j.ok) throw j.err||'x'; alert('✅ '+c.nom+' est débloquée'+(j.raison?'\n(raison du blocage : '+j.raison+')':'')); places(); }
  catch(e){ alert(e==='tok'?'🔐 Activez ce téléphone patron':'❌ Pas fait — réessayez'); btn.disabled=false; btn.textContent='🔓 Débloquer'; }
}
async function plRecreer(btn){
  const sh=btn.dataset.sh, c=plListe(sh)[+btn.dataset.i]; if(!c) return;
  if(!confirm('Recréer la fiche de '+c.nom+' ('+c.tel+') dans « Employés » ?\nSon contrat '+sh+' du '+dm(c.deb)+' au '+dm(c.fin)+' est gardé.')) return;
  try{ const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'ficherecreer',row:c.row,cle:c.cle})})));
    if(!j.ok) throw j.err||'x'; alert('✅ Fiche de '+j.nom+' recréée dans « Employés »'); places(); }
  catch(e){ alert(e==='tok'?'🔐 Activez ce téléphone patron':e==='change'?'⚠️ Le planning a changé — rechargez la page':'❌ Pas fait — réessayez'); }
}
async function plRetirer(btn){
  const sh=btn.dataset.sh, c=plListe(sh)[+btn.dataset.i]; if(!c) return; const row=c.row, cle=c.cle, deb=c.deb, nom=c.nom;
  if(!confirm('Retirer du planning le contrat de '+nom+' ('+sh+', début '+dm(deb)+') ?\n\nÀ faire seulement pour un doublon ou une fille qui ne travaille plus.\n⚠️ Si son téléphone est encore actif, il peut le renvoyer : dans ce cas mettez son numéro dans l\'onglet « 🚫 Interdites ».')) return;
  try{ const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'cycleretire',row,cle,deb})})));
    if(!j.ok) throw j.err||'x'; places(); }
  catch(e){ alert(e==='tok'?'🔐 Activez ce téléphone patron':e==='change'?'⚠️ Le planning a changé — rechargez la page':'❌ Pas fait — réessayez'); }
}
// ===== ✏️ CORRIGER LES MASSAGES D'UNE EMPLOYÉE : employée + date → tableau à remplir → le téléphone se met à jour =====
let JOURS={}, orig=null;   // JOURS[date] = { clé employée : {l1,l2,hh} }
const PX={l1:600,l2:800,hh:600};
function pm(k,d){ const el=$(k); el.value=Math.max(0,(+el.value||0)+d); corCa(); }
function corAff(){ let t=0, o=0; ['l1','l2','hh'].forEach(k=>{ const v=Math.max(0,+$(k).value||0); $('m_'+k).textContent=(v*PX[k]).toLocaleString('en-US')+' ฿'; t+=v*PX[k]; o+=((orig||{})[k]||0)*PX[k]; });
  $('m_tot').textContent=t.toLocaleString('en-US')+' ฿'; $('o_tot').textContent=o.toLocaleString('en-US')+' ฿'; }
function corCa(){ corAff(); $('corOk').disabled=false; $('corMsg').textContent='⚠️ pas encore enregistré'; $('corMsg').style.color='#d97706'; }
function corListe(){
  const S=$('corEmp'), v=S.value; S.innerHTML='<option value="">— choisir l\'employée —</option>';
  emps.forEach(e=>{ const o=document.createElement('option'); o.value=e.label; o.textContent=(e.service?'● ':'')+e.nom; S.appendChild(o); });
  S.value=emps.some(e=>e.label===v)?v:'';
  if(!$('corJour').value){ $('corJour').value=isoJ(0); $('corJour').max=isoJ(0); $('corJour').min=isoJ(-60); }
  corDraw();
}
async function corDraw(){
  const k=$('corEmp').value, d=$('corJour').value; orig=null;
  $('corTab').style.display='none'; $('corOk').disabled=true; $('corMsg').textContent='';
  if(!k||!d){ $('corInfo').textContent=!k?'Choisissez une employée.':'Choisissez la date.'; return; }
  if(!JOURS[d]){
    $('corInfo').textContent='Chargement…';
    try{ const j=JSON.parse(await readTxt(await fetch(API+'?boss=1&pin='+encodeURIComponent(getPin())+'&mjour='+d+'&_='+Date.now()))); JOURS[d]=j.jour||{}; }
    catch(e){ $('corInfo').textContent='⚠️ Pas de connexion — réessayez'; return; }
    if($('corEmp').value!==k||$('corJour').value!==d) return;   // choix changé pendant le chargement
  }
  const m=JOURS[d][cleE(k)], p=d.split('-'), nom=k.split(' — ')[0];
  if(!m){ $('corInfo').textContent='❌ '+nom+' n\'a pas de journée envoyée le '+p[2]+'/'+p[1]+' — rien à corriger.'; return; }
  orig=m; $('corInfo').textContent=nom+' · journée du '+p[2]+'/'+p[1]+'/'+p[0];
  ['l1','l2','hh'].forEach(x=>{ $(x).value=m[x]||0; $('o_'+x).textContent=m[x]||0; });
  $('corTab').style.display=''; corAff();
}
async function corEnvoyer(){
  const k=$('corEmp').value, d=$('corJour').value; if(!k||!d) return; const b=$('corOk'); b.disabled=true; b.textContent='⏳ …';
  try{
    const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'bosscorrige',label:k,date:d,l1:+$('l1').value||0,l2:+$('l2').value||0,hh:+$('hh').value||0})})));
    if(!j.ok) throw j.err||'x';
    JOURS[d][cleE(k)]={l1:j.l1,l2:j.l2,hh:j.hh}; await corDraw();
    $('corMsg').style.color='var(--green)'; $('corMsg').textContent='✅ Corrigé ('+j.ca.toLocaleString('en-US')+' ฿) — le téléphone de '+k.split(' — ')[0]+' se met à jour à la prochaine ouverture';
  }catch(e){ $('corMsg').style.color='var(--red)'; $('corMsg').textContent=e==='ligne'?'❌ Aucune journée envoyée à cette date':e==='date'?'❌ Date non permise (pas dans le futur, 60 jours max)':'❌ Pas envoyé — réessayez'; $('corOk').disabled=false; }
  b.textContent='✔ Enregistrer la correction';
}
// ===== ⏰ HEURE D'ARRIVÉE : le patron valide l'heure réelle → le téléphone recalcule le retard =====
let ARR={};
const cleE=l=>{ const p=l.split(' — '); return p.slice(0,-1).join(' — ').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(p[p.length-1]).replace(/\D/g,''); };
const debutSh=sh=>{ const m=String(sh||'').match(/^(\d{1,2})[h:](\d{2})?/); return m?('0'+m[1]).slice(-2)+':'+(m[2]||'00'):''; };
function arrListe(){
  const S=$('arrEmp'), v=S.value; S.innerHTML='<option value="">— choisir l\'employée —</option>';
  emps.forEach(e=>{ const o=document.createElement('option'); o.value=e.label; const ok=ARR[cleE(e.label)];
    o.textContent=(e.service?'● ':'')+e.nom+(e.service&&e.depuis?' · ▶️ '+e.depuis:'')+(ok?' · ✔ '+ok:''); S.appendChild(o); });
  S.value=emps.some(e=>e.label===v)?v:''; arrDraw();
}
function arrDraw(){
  const k=$('arrEmp').value; $('arrOk').disabled=!k; $('arrMsg').textContent='';
  if(!k){ $('arrInfo').textContent=''; return; }
  const e=emps.find(x=>x.label===k)||{}, h=HOR[k], ok=ARR[cleE(k)];
  $('arrInfo').textContent=(h?'Horaire '+h.sh+' · ':'')+(e.service&&e.depuis?'selfie à '+e.depuis:'pas de selfie aujourd\'hui')+(ok?' · ✔ déjà validé à '+ok:'');
  $('arrH').value=ok||(h?debutSh(h.sh):'')||e.depuis||'';
  $('arrOk').textContent='✔ Valider : '+(e.nom||'')+' arrivée à '+($('arrH').value||'…');
}
if($('arrH')) $('arrH').addEventListener('input',()=>{ const e=emps.find(x=>x.label===$('arrEmp').value); if(e) $('arrOk').textContent='✔ Valider : '+e.nom+' arrivée à '+$('arrH').value; });
async function arrValider(){
  const k=$('arrEmp').value, h=$('arrH').value; if(!k||!h) return; const b=$('arrOk'); b.disabled=true; const t0=b.textContent; b.textContent='⏳ …';
  try{
    const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'bossarrivee',label:k,date:isoJ(0),heure:h})})));
    if(!j.ok) throw 0;
    ARR[cleE(k)]=j.heure; $('arrMsg').style.color='var(--green)';
    $('arrMsg').textContent='✅ Arrivée de '+j.nom+' validée à '+j.heure+' — son téléphone recalcule le retard à la prochaine ouverture';
    const v=k; arrListe(); $('arrEmp').value=v; $('arrInfo').textContent+=' ';
  }catch(e){ $('arrMsg').style.color='var(--red)'; $('arrMsg').textContent='❌ Pas envoyé — réessayez'; }
  b.disabled=false; b.textContent=t0;
}
// ===== 🕐 CHANGER L'HORAIRE : contrat en cours (ou le prochain) → envoyé au téléphone de l'employée =====
let HOR={}, horChoix='';
const dmy=s=>String(s||'').split('-').reverse().slice(0,2).join('/');
function horListe(){
  const S=$('horEmp'), v=S.value; S.innerHTML='<option value="">— choisir l\'employée —</option>';
  Object.keys(HOR).sort().forEach(k=>{ const o=document.createElement('option'); o.value=k; const f=SH.find(x=>x[0]===HOR[k].sh); o.textContent=k.split(' — ')[0]+' · '+(f?f[1].replace(' (mensuel)',''):HOR[k].sh); S.appendChild(o); });
  if(!Object.keys(HOR).length){ const o=document.createElement('option'); o.textContent='Aucun contrat en cours'; S.appendChild(o); }
  S.value=HOR[v]?v:''; horDraw();
}
function horDraw(){
  const k=$('horEmp').value, c=HOR[k], B=$('horSh'); B.innerHTML=''; horChoix=''; $('horOk').disabled=true;
  if(!c){ $('horInfo').textContent=''; return; }
  $('horInfo').textContent='Contrat '+(c.mensuel?'mensuel':'freelance')+' du '+dmy(c.deb)+' au '+dmy(c.fin)+(c.impose?' · 👑 horaire déjà changé par vous':'');
  SH.filter(x=>c.mensuel ? /mensuel/.test(x[1]) : !/mensuel/.test(x[1])).forEach(([sh,l])=>{
    const b=document.createElement('button'); b.textContent=(sh===c.sh?'● ':'')+l.replace(' (mensuel)','');
    if(sh===c.sh){ b.style.fontWeight='800'; b.disabled=true; }
    b.onclick=()=>{ horChoix=sh; [...B.children].forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('horOk').disabled=false; $('horOk').textContent='✔ Changer : '+k.split(' — ')[0]+' → '+l.replace(' (mensuel)',''); };
    B.appendChild(b); });
}
async function horValider(){
  const k=$('horEmp').value; if(!k||!horChoix) return; const b=$('horOk'); b.disabled=true; b.textContent='⏳ …';
  try{
    const j=JSON.parse(await readTxt(await fetch(API,{method:'POST',body:JSON.stringify({type:'bosshoraire',label:k,sh:horChoix})})));
    if(!j.ok) throw j.err||'x';
    $('horMsg').style.color='var(--green)'; $('horMsg').textContent='✅ Horaire changé — le téléphone de '+k.split(' — ')[0]+' se met à jour à la prochaine ouverture'+(j.alerte?' · ⚠️ '+j.alerte:'');
    HOR[k]={...HOR[k],sh:j.sh,impose:true}; horListe(); if($('places')) places();
  }catch(e){ $('horMsg').style.color='var(--red)'; $('horMsg').textContent=e==='contrat'?'❌ Pas de contrat en cours pour cette employée':e==='meme'?'⛔ Refusé : une autre employée commence le même jour sur cet horaire':'❌ Pas envoyé — réessayez'; }
  b.textContent='✔ Changer l\'horaire';
}

async function charger(){
  try{
    const j=await chargerBoss(); $('err').textContent='';
    emps=j.emps||[]; HOR=j.hor||{}; ARR=j.arr||{}; JOURS[isoJ(0)]=j.jour||{};
    if($('horEmp')) horListe(); if($('arrEmp')) arrListe(); if($('corEmp')) corListe();
  }catch(e){ $('err').textContent='⚠️ Pas de connexion — réessayez'; }
}
function actualiser(){ if($('corEmp')||$('arrEmp')||$('horEmp')) charger(); if($('places')) places(); }
actualiser();
</script>
