<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f59e0b">
<title>🔔 Demandes d'autorisation</title>
<style>
  :root{--bg:#e5e7eb;--card:#fff;--text:#111827;--muted:#6b7280;--red:#dc2626;--green:#16a34a;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .wrap{max-width:460px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 10px;}
  h1{font-size:1.25rem;margin:4px 0 6px;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:.88rem;line-height:1.5}
  .vide{background:var(--card);border-radius:16px;padding:22px 14px;text-align:center;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .vide b{display:block;font-size:1.1rem;margin-top:6px}
  #autZone{max-width:460px;margin:0 auto !important;position:static !important}
  a.back{display:block;text-align:center;margin:14px 0 30px;color:var(--red);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔔 Demandes d'autorisation</h1>
  <div class="sub">Mode patron, déblocage, réouverture d'une journée, paiement reçu, nouvelle employée, démarrage hors GPS…<br>Vérifié toutes les 4 secondes · laissez cette page ouverte</div>
  <div class="vide" id="vide"><div style="font-size:2.4rem">✅</div><b>Aucune demande en attente</b><span class="sub" id="maj"></span></div>
</div>
<script src="autorisation.js?v=8" data-aut="rapide"></script>
<script>
(function(){
  const Z=document.getElementById('autZone'), V=document.getElementById('vide'), W=document.querySelector('.wrap');
  if(Z){ W.after(Z); }
  const maj=()=>{ const n=Z ? Z.querySelectorAll('.d').length : 0; V.style.display=n?'none':'block';
    document.getElementById('maj').textContent='Dernière vérification : '+new Date().toTimeString().slice(0,8);
    document.title=(n?'('+n+') ':'')+'🔔 Demandes d\'autorisation'; };
  if(Z) new MutationObserver(maj).observe(Z,{childList:true}); setInterval(maj,4000); maj();
})();
</script>
<div style="max-width:460px;margin:0 auto;padding:0 14px"><a class="back" href="patron.html">← Espace patron</a></div>
</body>
</html>
