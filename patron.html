<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Mode Patron — Gestion du Personnel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 15px; color: #1f2937; }
        h1, h2 { color: #111827; margin-bottom: 10px; font-size: 18px; border-bottom: 2px solid #e5e7eb; padding-bottom: 5px; }
        .section { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .emp-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f3f4f6; }
        .emp-row:last-child { border-bottom: none; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-primary { background-color: #3b82f6; color: white; }
        select, input { padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; width: 100%; margin-top: 5px; box-sizing: border-box; }
        .badge { padding: 4px 8px; border-radius: 9999px; font-size: 11px; font-weight: bold; }
        .badge-active { background-color: #dcfce7; color: #15803d; }
        .badge-blocked { background-color: #fee2e2; color: #b91c1c; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

    <div class="section">
        <h1>👑 MODE PATRON — Statut de l'Équipe</h1>
        <div id="loadingTeam">Chargement des données...</div>
        <div id="listeEquipe"></div>
    </div>

    <div class="section">
        <h2>📵 Appliquer une Infraction Téléphone</h2>
        <label for="selectEmpInfraction">Sélectionner une employée :</label>
        <select id="selectEmpInfraction"></select>
        
        <label for="typeInfraction" style="margin-top: 10px; display: block;">Niveau d'infraction :</label>
        <select id="typeInfraction">
            <option value="1">1 — Avertissement formel</option>
            <option value="2">2 — -200 ฿</option>
            <option value="3">3 — -500 ฿ + Garantie annulée</option>
            <option value="4">4 — -500 ฿ + Clause Guillotine</option>
        </select>
        <button class="btn btn-danger" style="width:100%; margin-top:15px;" onclick="validerInfraction()">✔ Valider l'infraction</button>
    </div>

    <div class="section">
        <h2>⏰ Valider Heure d'Arrivée (Aujourd'hui)</h2>
        <select id="selectEmpArrivee"></select>
        <div class="grid-2" style="margin-top: 10px;">
            <input type="date" id="dateArrivee">
            <input type="time" id="heureArrivee">
        </div>
        <button class="btn btn-success" style="width:100%; margin-top:15px;" onclick="validerArrivee()">✔ Corriger & Valider l'arrivée</button>
    </div>

    <script>
        const API_URL = "https://google.com";

        function chargerDonneesPatron() {
            fetch(`${API_URL}?boss=1`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('loadingTeam').style.display = 'none';
                    construireListeEquipe(data.emps);
                }).catch(err => alert("Erreur réseau : " + err));
        }

        function construireListeEquipe(employes) {
            const liste = document.getElementById('listeEquipe');
            const selectInf = document.getElementById('selectEmpInfraction');
            const selectArr = document.getElementById('selectEmpArrivee');
            
            liste.innerHTML = "";
            selectInf.innerHTML = "";
            selectArr.innerHTML = "";

            document.getElementById('dateArrivee').valueAsDate = new Date();

            employes.forEach(e => {
                let opt = `<option value="${e.label}">${e.nom} (${e.tel})</option>`;
                selectInf.innerHTML += opt;
                selectArr.innerHTML += opt;

                let badge = e.bloque ? `<span class="badge badge-blocked">Bloquée</span>` : `<span class="badge badge-active">Active</span>`;
                let actionBtn = e.bloque 
                    ? `<button class="btn btn-success" onclick="changerStatut('${e.label}', 'reintegrer')">Réintégrer</button>`
                    : `<button class="btn btn-danger" onclick="changerStatut('${e.label}', 'bloquer')">🚫 Bloquer (Démission)</button>`;

                liste.innerHTML += `
                    <div class="emp-row">
                        <div>
                            <strong>${e.nom}</strong> <small style="color:gray;">${e.tel}</small><br>
                            ${badge} <small>${e.depuis ? '▶ '+e.depuis : ''}</small>
                        </div>
                        <div>${actionBtn}</div>
                    </div>
                `;
            });
        }

        function changerStatut(label, action) {
            if(!confirm(`Confirmer l'action sur ${label.split(' — ')} ?`)) return;
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ type: "bossdemission", label: label, action: action })
            }).then(r => r.json()).then(res => { if(res.ok) chargerDonneesPatron(); });
        }

        function validerInfraction() {
            const label = document.getElementById('selectEmpInfraction').value;
            const n = document.getElementById('typeInfraction').value;
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ type: "infraction", label: label, n: n })
            }).then(r => r.json()).then(res => { alert("Infraction enregistrée !"); chargerDonneesPatron(); });
        }

        function validerArrivee() {
            const label = document.getElementById('selectEmpArrivee').value;
            const date = document.getElementById('dateArrivee').value;
            const heure = document.getElementById('heureArrivee').value;
            if(!heure) return alert("Veuillez saisir une heure");
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ type: "bossarrivee", label: label, date: date, heure: heure })
            }).then(r => r.json()).then(res => { alert("Heure d'arrivée validée !"); chargerDonneesPatron(); });
        }

        window.onload = chargerDonneesPatron;
    </script>
</body>
</html>
